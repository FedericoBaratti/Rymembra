# Cosa `cargo deny check` lascia entrare nel programma.
#
# Gira nella CI (`verify.yml`, lavoro `dipendenze`) e a mano con:
#
#   cargo deny check
#
# # Perché Windows e Android, e non gli altri
#
# Perché sono i due bersagli che si distribuiscono: l'installer per Windows e
# l'APK per i telefoni a 64 bit (`rust-toolchain.toml`). Fino all'APK c'era solo
# Windows, e le dipendenze che entrano soltanto nel telefono — `jni`,
# `ndk-context`, il ponte verso Kotlin, le radici di Mozilla — passavano senza
# che nessuno ne leggesse licenze e avvisi. Linux e macOS restano fuori: senza
# questa riga `cargo deny` guarderebbe anche le dipendenze che `tauri` e `cpal`
# si portano dietro per loro — codice che in Rymembra non entra — e una CI che
# fallisce per un crate di ALSA è una CI che si impara a ignorare.
#
# L'emulatore (`x86_64-linux-android`) non ha una riga sua: è lo stesso albero
# del telefono, e nessuno lo distribuisce.
[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-linux-android"]
all-features = false

# Gli avvisi di sicurezza di RustSec. Un avviso aperto ferma la CI: lo si
# legge, e se non tocca Rymembra lo si scrive qui sotto con il perché, invece di
# spegnere il controllo.
[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` non ha più un manutentore, e lo dice l'avviso: non c'è un difetto.
  # È una macro che gira solo in compilazione, e non finisce nell'eseguibile. La
  # portano due crate: `lofty` (i tag dei file audio) e `netlink-packet-core`
  # (iroh → netwatch → netlink-*, cioè la lettura delle interfacce di rete su
  # Android). Si toglie da qui quando tutti e due la sostituiscono.
  { id = "RUSTSEC-2024-0436", reason = "macro di sola compilazione, portata da lofty e da netlink-packet-core; nessun codice nell'eseguibile" },
  # Tre difetti della copia 4.x di `zip`, quella di `tauri-plugin-updater` (la
  # nostra è la 9, che li ha chiusi), tutti dentro `ZipArchive::extract` e
  # `ZipStreamReader::extract`, l'estrazione di un archivio intero su disco: bit
  # SUID/SGID conservati, permessi Unix
  # applicati attraverso un collegamento simbolico, collegamenti simbolici che
  # puntano fuori dalla cartella. Rymembra non estrae mai un archivio intero:
  # skin, profili e archivi degli account si leggono voce per voce, con i nomi
  # controllati uno a uno. L'updater chiama `extract` solo su un aggiornamento
  # impacchettato in zip, e solo dopo averne verificato la firma con la nostra
  # chiave (`Update::download`); le release pubblicano l'installer `.exe`, non
  # uno zip. I permessi Unix su Windows non esistono. La correzione è `zip` 9:
  # per l'updater quando la porta lui (`tauri-plugin-updater` 2.14.1).
  { id = "RUSTSEC-2026-0367", reason = "zip: SUID/SGID in extract(); mai chiamato da noi, l'updater estrae solo pacchetti firmati, e su Windows non ci sono" },
  { id = "RUSTSEC-2026-0368", reason = "zip: link simbolici fuori dalla cartella in extract(); mai chiamato da noi, l'updater estrae solo pacchetti firmati" },
  { id = "RUSTSEC-2026-0369", reason = "zip: permessi Unix attraverso link simbolici in extract(); mai chiamato da noi, e su Windows non ci sono" },
  # Un quarto difetto di `zip`, nello stesso posto: `extract` che abortisce su
  # una voce simbolica con una dimensione dichiarata enorme. Vale quel che vale
  # per i tre sopra — nessuna chiamata a `extract` nel nostro codice, e
  # l'updater estrae solo pacchetti firmati.
  { id = "RUSTSEC-2026-0429", reason = "zip: abort in extract() su un link simbolico enorme; mai chiamato da noi, l'updater estrae solo pacchetti firmati" },
  # Altri due avvisi di `zip`, usciti il 17 e il 22 ottobre 2026 (advisory-db),
  # corretti in `zip` 9 (la 0548 solo dalla 9.0.5) e nessuno raggiungibile qui:
  # restano per la copia 4.6 di `tauri-plugin-updater`, che non porta `aes` e ha
  # solo `deflate`. Il `Cargo.lock` lo mostra: né `aes` né `bitstream-io`.
  # - 0545: le voci cifrate AES accettate senza controllarne il codice di
  #   autenticazione. Esiste solo con la feature `aes-crypto`.
  # - 0548: `ZipStreamReader`, che estrae con i nomi delle intestazioni locali.
  #   Non lo usiamo noi, e l'updater apre con `ZipArchive`.
  { id = "RUSTSEC-2026-0545", reason = "zip: AES senza codice di autenticazione; feature aes-crypto spenta" },
  { id = "RUSTSEC-2026-0548", reason = "zip: ZipStreamReader con i nomi locali; mai usato, né da noi né dall'updater" },
  # `chrono` non ha più un manutentore. L'avviso non segnala un difetto e non
  # propone una versione sicura. Arriva solo per via indiretta: iroh → netwatch
  # → wmi, cioè la lettura delle interfacce di rete di Windows. Si toglie da qui
  # quando `wmi` lo sostituisce.
  { id = "RUSTSEC-2026-0543", reason = "chrono senza manutentore: nessun difetto, solo per via indiretta (iroh → netwatch → wmi)" },
]

# L'elenco chiuso delle licenze che `THIRD-PARTY-NOTICES.md` sa già
# attribuire (`strumenti/licenze.js` ne copia i testi). Una licenza nuova non è
# vietata: va letta, aggiunta qui **e** a quel file nello stesso cambio.
#
# Niente GPL né LGPL: l'eseguibile è uno solo, statico, distribuito con licenza
# MIT, e una dipendenza copyleft cambierebbe quel che si può fare del tutto.
# MPL-2.0 sta nell'elenco perché vale file per file (symphonia, cssparser): chi
# riceve Rymembra riceve anche il diritto di avere quei file, e il README dice dove.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # `spez`, portato da iroh attraverso `n0-error`.
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Due versioni dello stesso crate costano solo tempo di compilazione e peso
# dell'eseguibile: si segnalano, non fermano niente. Quasi sempre vengono da
# `tauri` o da `windows-*`, e non si risolvono da qui.
[bans]
multiple-versions = "warn"
wildcards = "deny"
# I crate dell'albero si chiamano fra loro per percorso, ed è giusto così.
allow-wildcard-paths = true

# Tutto da crates.io. Un crate preso da un repository git sarebbe codice che
# nessun registro ha visto passare, e che può cambiare sotto lo stesso nome.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
