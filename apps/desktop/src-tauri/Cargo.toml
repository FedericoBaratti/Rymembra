[package]
name = "rymembra-desktop"
description = "L'applicazione desktop: una finestra sopra il nucleo, niente logica propria."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Ereditato perché finisce in `CARGO_PKG_REPOSITORY`, che `comandi.rs` legge
# per costruire gli indirizzi dei documenti pubblici e delle donazioni. Senza
# questa riga cargo definisce la variabile lo stesso, **vuota**: i tasti della
# licenza e delle segnalazioni chiedevano al browser di aprire `/issues`.
repository.workspace = true

# Il binario si chiama `rymembra`, non `rymembra-desktop`: è il nome che l'utente
# vede nel gestore attività e nella barra delle applicazioni.
# Nessuno di questi crate va su crates.io.
#
# Non è modestia: sono i pezzi di un'applicazione, con nomi che occuperebbero
# uno spazio dei nomi pubblico senza offrire niente a nessuno, e con un patto
# di stabilità che non esiste — le firme qui dentro cambiano quando serve.
# Senza questa riga un `cargo publish` distratto dalla radice li
# pubblicherebbe tutti, e un nome preso su crates.io non si restituisce.
publish = false

[[bin]]
name = "rymembra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rymembra-app = { path = "../../../core/rymembra-app" }
rymembra-play = { path = "../../../core/rymembra-play" }
rymembra-cloud = { path = "../../../core/rymembra-cloud" }
rymembra-domain = { path = "../../../core/rymembra-domain" }
# Il motore della sincronia. Serve qui per due cose sole: costruire il deposito
# — una cartella o il Drive di `rymembra-cloud` — e tenere in vita la memoria della
# passata fra un giro e l'altro. Tutto il resto di cosa sopravvive quando due
# dispositivi si incontrano è deciso là dentro, senza disco e senza rete.
rymembra-sync = { path = "../../../core/rymembra-sync" }
# Per portare dentro la copertina da incorporare nei tag di un brano appena
# preso. Stessa `Rete` che usa `rymembra-catalogo`, così l'agente e i timeout sono
# quelli, non una seconda idea di cosa sia una richiesta HTTP.
rymembra-net = { path = "../../../core/rymembra-net" }
# La lettura dell'archivio che Spotify manda per posta: la via che non chiede
# nessuna chiave e nessun abbonamento. Non vede `rusqlite`, ed e` quel che rende
# impossibile tenere preso il lucchetto della libreria mentre si scompatta uno
# zip da trecento megabyte.
rymembra-archivio = { path = "../../../core/rymembra-archivio" }
# Il portachiavi di sistema, con la feature accesa: dove i segreti stanno lo
# decide chi ha un sistema operativo sotto, cioe` questo crate. I crate del
# nucleo lo dichiarano `default-features = false` proprio per non decidere al
# posto suo.
rymembra-oauth = { path = "../../../core/rymembra-oauth", features = ["portachiavi"] }
# Solo per costruire i `Fornitori` che il filo dell'arricchimento tiene vivi fra
# una passata e l'altra: dentro ci sono la riserva di connessioni e — quel che
# conta — lo stato degli interruttori, che rinascendo a ogni passata non
# riuscirebbe mai a ricordare che MusicBrainz è giù.
rymembra-meta = { path = "../../../core/rymembra-meta" }
# I due protocolli di scrobbling. La coda sta in `rymembra-app` e non conosce la
# rete; questo crate mette in mezzo le credenziali e il filo che svuota.
rymembra-scrobble = { path = "../../../core/rymembra-scrobble" }
# Il client dei modelli di linguaggio. Non conosce le skin — le istruzioni che
# descrivono i token gliele passa la finestra — e non conosce il portachiavi: la
# chiave la prende `ia.rs`, un istante prima della richiesta.
rymembra-ia = { path = "../../../core/rymembra-ia" }
# «Ascolta insieme»: la rete fra due o più Rymembra della stessa LAN. Il
# trasporto non sa niente del lettore; il desktop lo collega al motore.
rymembra-insieme = { path = "../../../core/rymembra-insieme" }
rymembra-skin = { path = "../../../core/rymembra-skin" }
# I cataloghi liberi: l'unico posto dell'albero che va a prendere dei byte
# musicali, e lo fa solo dove prenderli è espressamente permesso. Nessun
# processo figlio, nessun binario impacchettato.
rymembra-catalogo = { path = "../../../core/rymembra-catalogo" }
# La stessa versione che usa `rymembra-app`: due `rusqlite` diversi nell'albero
# darebbero due tipi `Connection` incompatibili, e l'errore che ne esce parla di
# tratti non implementati invece che di versioni. Le opzioni di serie spente
# per la stessa ragione scritta là: accese qui, rientrerebbero per tutti.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# Senza `protocol-asset`: le copertine passano da uno schema nostro, che accetta
# un'impronta e non un percorso. Il protocollo generale servirebbe file
# arbitrari dietro una lista di cartelle permesse — più superficie, per una cosa
# che non ci serve.
#
# Con `tray-icon`: l'icona nell'area di notifica è il modo di tornare da una
# finestra nascosta, e senza un modo di tornare «chiudi senza spegnere» sarebbe
# un programma che si perde. La feature accende `tray-icon` e `muda`, che erano
# **già** nel grafo delle dipendenze di `tauri` — non entra niente di nuovo nel
# `Cargo.lock`, si accende quel che c'era spento.
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
# La schermata di consenso di Google si apre nel browser di **sistema**, mai
# nella webview: una finestra dell'app che sa disegnare `accounts.google.com` è
# una superficie di phishing, e allargare il CSP per sempre per un'operazione da
# cinque minuti l'anno non si fa.
tauri-plugin-opener = "2.6"
# L'aggiornamento automatico. L'obiezione ovvia — «porta dentro `reqwest` e
# `tokio`, e la radice del workspace spiega per bene perché Rymembra usa `ureq`» —
# vale a metà, e va detto quale metà. `tokio` no: `tauri 2.12` ne dipende già
# in modo diretto, e sta nel binario da quando esiste questa finestra.
# `reqwest` sì: su Windows `tauri` lo chiede solo per Android e iOS, e qui lo
# porta questo plugin, con `hyper` sotto. Quel che non porta è un secondo TLS:
# `rustls` e `rustls-platform-verifier` sono gli stessi che usa `ureq`, cioè una
# copia sola del codice che decide di chi fidarsi.
#
# Dalla 2.12 il permesso di tornare indietro di versione (`allowDowngrades`)
# non arriva più dalla webview ma dalla configurazione, spento di serie. Rymembra
# non lo accende e non ha `updater:*` fra i permessi della finestra: tutto passa
# da `crate::aggiornamenti`, lato Rust.
#
# Quel che aggiunge davvero è la verifica minisign della firma, ed è l'unica
# ragione per cui vale la pena dipendere da qualcosa invece di scaricare un
# `.json` con la `Rete` che abbiamo: un updater che non verifica la firma è un
# canale per cui chiunque sappia rispondere al posto di GitHub installa un
# eseguibile sul computer di chi ci si fida.
tauri-plugin-updater = "2.13"
# Una sola Rymembra per volta, e il perché sta su `main::una_sola_istanza`: due
# processi sulla stessa cartella dati sono due mutex della libreria che non si
# vedono, e due icone nel vassoio di cui una non sta suonando.
#
# Quel che aggiunge al programma è misurabile e piccolo: nel `Cargo.lock` una
# riga sola, la sua (673 pacchetti → 674), perché tutto ciò da cui dipende c'era
# già — `serde`, `serde_json`, `tauri`, `tracing`, `thiserror`, `tokio` e
# `windows-sys 0.60`, quest'ultimo nella versione esatta. A regime, su Windows, un
# mutex
# nominato e una finestra di soli messaggi, cioè due handle del sistema
# operativo. Nessun filo, nessun timer, nessuna richiesta: il suo codice gira una
# volta nel `setup` e poi solo se qualcuno lancia un secondo processo.
#
# L'alternativa senza dipendenza — un file di lock nella cartella dati — sa dire
# «c'è già qualcuno» e non sa fare la cosa per cui serve, cioè riportare davanti
# la finestra che c'è già. Per farlo servirebbe parlare di `FindWindowW` e
# `WM_COPYDATA` col sistema operativo, e la radice del workspace vieta `unsafe`
# con `forbid`: è la stessa ragione per cui `souvlaki` è una dipendenza e non
# quattro chiamate a mano.
#
# `default-features`: quelle di serie, che sono nessuna. `semver` farebbe
# convivere due Rymembra di versione maggiore diversa — non è un caso che esista
# qui — e `deep-link` riguarda un plugin che non c'è.
tauri-plugin-single-instance = "2.5"
# I controlli multimediali del sistema operativo: su Windows le
# `SystemMediaTransportControls`, cioè la scheda che compare nel riquadro del
# volume, l'anteprima sulla barra delle applicazioni e — la cosa che si sente
# ogni giorno — i tasti play/pausa/avanti della tastiera.
#
# Una dipendenza e non quattro chiamate a mano al crate `windows`, che pure
# c'è già nell'albero, per una ragione sola: la radice del workspace vieta
# `unsafe` con `forbid`, che non si scavalca con un `#[allow]`, e parlare di
# COM col sistema operativo è `unsafe` per definizione. `souvlaki` quel codice
# ce l'ha dentro, provato e usato da altri; scriverlo qui vorrebbe dire
# declassare a `deny` un principio che vale per tutto il resto del programma,
# e cambiare quella riga per l'unico modulo che ne avrebbe bisogno è il modo
# di scoprire fra un anno che ne ha bisogno anche un altro.
#
# Non serve **anche** `tauri-plugin-global-shortcut`: registrando SMTC è
# Windows a instradare i tasti multimediali all'applicazione che sta
# suonando. Un tasto registrato come scorciatoia globale lo ruberebbe invece a
# tutte le altre, per sempre, anche a lettore fermo.
souvlaki = { version = "0.8", default-features = false }
# I tre pulsanti sotto l'anteprima nella barra delle applicazioni — precedente,
# riproduci o pausa, successivo — come in foobar2000. Le SMTC qui sopra danno
# la scheda nel riquadro del volume, non questi.
#
# Un crate nostro e non una dipendenza, contro la regola che vale per
# `souvlaki` e `trash`: non c'è una dipendenza seria che lo faccia. L'unico
# plugin per Tauri è alla 0.1.0 con un commit, e perde lo stato dei pulsanti
# quando la barra li ricrea. Così l'`unsafe` che serve sta in un modulo solo di
# quel crate, con l'eccezione dichiarata nel `Cargo.toml` della radice; vedi
# `rymembra-barra/src/lib.rs`. Nel `Cargo.lock` non entra nessun pacchetto
# esterno: usa il `windows` 0.62 che c'era già.
rymembra-barra = { path = "../rymembra-barra" }
# Il Cestino del sistema operativo: su Windows la stessa `IFileOperation` che
# usa Esplora risorse, quindi un file eliminato da Rymembra si ritrova dove chi lo
# cerca andrebbe a cercarlo, con «Ripristina» accanto.
#
# Una dipendenza e non quattro chiamate a mano, per la ragione già scritta qui
# sopra per `souvlaki`: parlare di COM col sistema operativo è `unsafe` per
# definizione, e la radice del workspace lo vieta con `forbid`, che non si
# scavalca con un `#[allow]`. L'alternativa senza dipendenza non è «scrivere
# meno codice»: è `std::fs::remove_file`, cioè un'eliminazione che non si
# annulla dietro una voce di menù.
#
# `default-features = false` toglie `chrono`, che serve solo a chi vuole
# *elencare* e *ripristinare* quel che sta nel Cestino — Rymembra ci mette dentro
# e basta — e sarebbe una catena di dipendenze per una funzione mai chiamata.
# `coinit_apartmentthreaded` invece si tiene: è il modello COM con cui va
# inizializzato il filo che chiama, ed è quello che la shell di Windows si
# aspetta.
#
# Quel che costa, misurato e non stimato: `Cargo.lock` passa da 675 pacchetti a
# 682. Sono `trash`, `urlencoding` e un **quarto** `windows` (0.62.2) con i suoi
# quattro satelliti — `windows-collections`, `-future`, `-numerics`,
# `-threading`. Il quarto `windows` è il prezzo vero, e non si può evitare
# scegliendo un'altra versione: le 5.2 più vecchie chiedono la 0.56, che qui non
# c'è nemmeno. L'albero ne aveva già tre (0.44, 0.54, 0.61.3), nessuna delle
# quali è la nostra: le portano dentro `tauri` e i suoi plugin.
#
# Con `tauri 2.12` il conto si è rovesciato da sé: la finestra è passata anche
# lei alla 0.62, che adesso è quella di tutti e non più la nostra. La 0.61.3
# resta solo per `tauri-plugin-opener` e la 0.44 per `souvlaki`; la 0.54 se n'è
# andata con `cpal` 0.18, che parla con WASAPI da sé.
trash = { version = "5", default-features = false, features = [
    "coinit_apartmentthreaded",
] }
# Le cartelle sorvegliate: sapere che un file è comparso, cambiato o sparito
# sotto una cartella della libreria senza che nessuno prema «Scansiona». Su
# Windows è `ReadDirectoryChangesW`, la stessa notifica che tiene aggiornato
# Esplora risorse: un filo del sistema che dorme finché non succede qualcosa.
#
# Una dipendenza e non quattro chiamate a mano per la ragione già scritta per
# `souvlaki` e `trash`: `ReadDirectoryChangesW` con i suoi buffer sovrapposti è
# `unsafe` per definizione, e la radice del workspace lo vieta con `forbid`.
#
# La 8.x e non la 9: la 9 è ancora candidata. `default-features = false` toglie
# `macos_fsevent`, che porta il backend di macOS e non serve a nessuno qui; il
# canale è quello della libreria standard (niente `crossbeam-channel`), e
# l'accorpamento degli eventi lo fa `crate::sorveglia`, in poche righe provate,
# invece di `notify-debouncer-full` — che porterebbe una cache dei nomi di
# file per riconoscere le rinomine, quando a noi basta sapere **in quale
# cartella** è successo qualcosa.
notify = { version = "8.2", default-features = false }

[features]
# L'interruttore di Jamendo, da qui. Inoltra quello di `rymembra-catalogo`, dove
# sta scritto per esteso perche` e` spento: la loro API e` gratuita per i soli
# usi non commerciali, e se le donazioni contino come compenso deve dirlo
# Jamendo. Accendendola qui si accende tutta la catena — client, comandi,
# diagnostica, schermata — in una riga sola.
jamendo = ["rymembra-catalogo/jamendo"]

[dev-dependencies]
# Installare una skin scrive un file: provarlo vuol dire una cartella vera che
# sparisce da sé. La stessa versione di `rymembra-app` e `rymembra-play`.
tempfile = "3"

[lints]
workspace = true
