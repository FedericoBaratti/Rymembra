<!doctype html>
<!--
  `lang` lo riscrive `src/lingue/applicaLingua`, prima del primo disegno.
  Qui sta il ripiego e nient'altro: un `lang` fisso su una pagina in un'altra
  lingua è una bugia che sentono solo la sillabazione e la sintesi vocale, cioè
  chi ha meno modo di accorgersene e più bisogno che sia giusto.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover`: da Android 15 la pagina disegna anche sotto le
         barre di sistema, e le distanze da quelle le dà `env(safe-area-inset-*)`
         (`stile/telefono.css`). Sul computer non cambia niente. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rymembra</title>
  </head>
  <body>
    <div id="radice"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
