[package]
name = "rymembra-barra"
description = "I tre pulsanti nell'anteprima della barra delle applicazioni: l'unico posto di Rymembra che parla col sistema operativo a mano."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Come tutti gli altri crate del workspace: è un pezzo dell'applicazione, non
# una libreria per altri. Vedi la riga gemella in `src-tauri/Cargo.toml`.
publish = false

# Solo su Windows. Altrove il crate compila lo stesso e non fa niente: vedi
# `src/lib.rs`.
#
# La 0.62 è quella che l'albero aveva già — la usano `tauri` e `trash` — e il
# `Cargo.lock` non guadagna nessun pacchetto: si accendono soltanto le parti
# dell'API che servono qui. `Win32_Storage_FileSystem` è per `GetDriveTypeW` e
# `GetVolumePathNameW` (vedi `src/unita.rs`), `Win32_System_Power` per
# `GetSystemPowerStatus` (vedi `src/sottofondo.rs`, con `SetThreadPriority` di
# `Win32_System_Threading`): nessuna delle due porta pacchetti nuovi.
# `Storage_Search` è la parte WinRT di `Windows.Storage` che nomina `StorageFolder`,
# per un'unica domanda e senza nessun `unsafe`: dove sta la cartella privata del
# pacchetto MSIX (`ApplicationData::LocalCacheFolder`, vedi `src/pacchetto.rs`).
# È una feature del `windows` che c'è già, come le altre: nel `Cargo.lock` non
# entra niente.
# `Win32_Devices_DeviceAndDriverInstallation` è per `CM_Register_Notification`
# (vedi `src/espulsione.rs`: Windows avvisa quando una chiavetta o un disco USB
# sta per essere espulso, perché la sorveglianza delle cartelle lo lasci), e
# `GetVolumeNameForVolumeMountPointW`, che serve alla stessa cosa, sta già in
# `Win32_Storage_FileSystem`. È una feature del `windows` che c'è già: nel
# `Cargo.lock` non entra niente.
# `Win32_UI_Input_KeyboardAndMouse` è per `GetAsyncKeyState` (vedi
# `src/maiusc.rs`: Maiusc tenuto mentre l'applicazione si apre): la accendono già
# `tao`, `wry` e `muda`, quindi nel `Cargo.lock` non entra niente nemmeno
# stavolta.
# `Win32_System_Registry` serve anche all'avvio con Windows (`src/registro.rs`:
# il valore in `HKCU\…\Run` e `StartupApproved`), ed era già accesa. Poi
# `ApplicationModel` e `ApplicationModel_Activation`, la parte WinRT che nomina
# `StartupTask` e `AppInstance` (`src/avvio.rs`): l'avvio della copia del Store e
# il riconoscimento di un login. Sono API sicure, come `ApplicationData` qui
# sopra, e due feature del `windows` che c'è già: nel `Cargo.lock` non entra
# niente.
# `Win32_System_LibraryLoader` (`GetModuleHandleW`) e `Win32_Graphics_Gdi` (che
# la `WNDCLASSEXW` nomina per il suo pennello) sono per la finestra dei messaggi
# delle SMTC (`src/messaggi.rs`): le accendono già `tao` e `wry`, e nel
# `Cargo.lock` non entra niente.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "ApplicationModel",
    "ApplicationModel_Activation",
    "Storage_Search",
] }

# Una tabella sua e non `workspace = true`, ed è tutta la ragione per cui questo
# crate esiste a parte: la radice vieta `unsafe` con `forbid`, che non si
# scavalca, e qui `unsafe` serve. Cargo non permette di ereditare la tabella del
# workspace e cambiarne una riga, quindi la si ricopia: i lint di clippy sono
# gli stessi, parola per parola, e `unsafe_code` scende da `forbid` a `deny` —
# vietato ovunque in questo crate tranne dove lo si dichiara: il modulo
# `src/finestra.rs`, la funzione `chiedi_a_windows` di `src/unita.rs`, le tre
# funzioni di sistema di `src/sottofondo.rs`, le quattro di `src/espulsione.rs`
# (il nome del volume, la registrazione degli avvisi di espulsione, la callback
# che Windows chiama e la registrazione tolta), la lettura di Maiusc di
# `src/maiusc.rs` (`GetAsyncKeyState`), le tre chiamate di `src/registro.rs`
# (`RegGetValueW`, `RegSetKeyValueW` e `RegDeleteKeyValueW`, per l'avvio con
# Windows) e il modulo `src/messaggi.rs`, la finestra nativa mai mostrata su cui
# si appendono le SMTC (la classe, `CreateWindowExW`, `DestroyWindow`, la
# procedura che passa tutto a `DefWindowProcW`).
#
# In cambio, tre regole che il resto del workspace non ha bisogno di avere: ogni
# blocco `unsafe` spiega perché è giusto (`undocumented_unsafe_blocks`), e dentro
# una funzione `unsafe` ogni operazione pericolosa sta comunque in un blocco suo
# (`unsafe_op_in_unsafe_fn`), così il conto delle cose da controllare è quello
# dei blocchi e non quello delle funzioni.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
undocumented_unsafe_blocks = "deny"
