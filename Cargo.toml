# Il workspace di tutto il repo.
#
# Stava in `core/`, quando in Rust c'era solo il nucleo. Con l'arrivo dell'app
# desktop il posto giusto è la radice: un membro fuori dalla cartella del
# workspace è legale ma bugiardo, e soprattutto un `cargo test` dalla radice
# deve costruire e provare anche l'app, non solo le librerie che usa.

[workspace]
resolver = "3"
members = [
    "core/rymembra-domain",
    "core/rymembra-play",
    "core/rymembra-app",
    "core/rymembra-skin",
    "core/rymembra-net",
    "core/rymembra-meta",
    "core/rymembra-catalogo",
    "core/rymembra-oauth",
    "core/rymembra-archivio",
    "core/rymembra-sync",
    "core/rymembra-cloud",
    "core/rymembra-scrobble",
    "core/rymembra-ia",
    "core/rymembra-insieme",
    "apps/desktop/src-tauri",
    "apps/desktop/rymembra-barra",
]

[workspace.package]
version = "3.1.0"
edition = "2024"
# Era 1.85, che è il minimo dell'edizione 2024. L'ha alzata prima `opus-pure`,
# il decodificatore Opus di `rymembra-play`, che ne dichiara 1.88; poi `tauri
# 2.12`, che insieme ai suoi plugin ne dichiara 1.90 (e `lofty 0.25` 1.89). Il
# numero qui deve essere il vero pavimento del workspace — dipendenze comprese —
# o non dice niente a nessuno. Conta anche per `cargo update`: il risolutore
# `3` scritto qui sopra preferisce le versioni che stanno sotto questo numero, e
# uno più basso del vero terrebbe indietro in silenzio proprio i crate che lo
# hanno alzato.
rust-version = "1.90"
license = "MIT"
authors = ["Federico Baratti"]
# La grafia è quella vera del repository, maiuscole comprese. GitHub
# reindirizza comunque, ma questa riga è il ripiego che `strumenti/manifesto.js`
# usa fuori dalla CI — dove l'indirizzo lo dice `GITHUB_REPOSITORY` — e due
# indirizzi diversi per la stessa release sono due modi di scoprire fra un anno
# quale dei due qualcuno aveva salvato.
repository = "https://github.com/FedericoBaratti/Rymembra"

[workspace.dependencies]
unicode-normalization = "0.1"
# La riparazione del testo illeggibile (`rymembra_domain::codifica`). Serve solo a
# DECODIFICARE: la strada di ritorno — dai caratteri ai byte che li avevano
# prodotti — è una tabella scritta a mano di trentadue voci, perché il
# codificatore di questa libreria sostituisce l'inrappresentabile con un
# riferimento numerico HTML invece di dire di no, e un "&#1057;" dentro un tag
# sarebbe un guasto peggiore di quello che si stava riparando.
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── la nuvola ───────────────────────────────────────────────────────────────
# Queste stanno qui e non in `rymembra-cloud` perché prima o poi le vorrà anche
# qualcun altro (il recupero delle copertine, l'arricchimento da MusicBrainz), e
# due versioni diverse di uno stack TLS nello stesso binario sono megabyte
# duplicati.
#
# `ureq` e non `reqwest`: è bloccante, e tutto Rymembra è bloccante. Un runtime
# asincrono per fare quattro richieste HTTP ogni quarto d'ora vorrebbe dire
# portarsi dietro tokio — e con lui una seconda idea di cos'è un errore, di
# cos'è un timeout e di chi possiede un thread.
#
# `platform-verifier`: i certificati li giudica il sistema operativo — su
# Windows lo stesso archivio di radici che usa Edge — e non un elenco cucito
# nel binario il giorno della compilazione. È ciò che fa funzionare Rymembra
# dietro un proxy aziendale o un antivirus che ispeziona il TLS con una radice
# installata a mano, e che fa sparire una radice ritirata con gli
# aggiornamenti di Windows invece che con la release successiva di Rymembra. La
# feature porta solo l'interruttore: accenderlo è di `rymembra_net::http`, dove
# si costruisce l'agente. Nel `Cargo.lock` non entra niente di nuovo:
# `rustls-platform-verifier` c'era già, lo usa il `reqwest` dell'updater.
ureq = { version = "3.4", features = ["platform-verifier"] }
flate2 = "1"
# L'impronta del contenuto. Sta qui e non più nel solo `rymembra-app` da quando la
# calcolano in due: il backup, per sapere se quei byte sono già lassù, e la
# sincronia, per sapere quali documenti degli altri dispositivi vale la pena
# scaricare. È la stessa domanda, e due implementazioni diverse della stessa
# domanda darebbero due risposte diverse sullo stesso file.
blake3 = "1.8.5"
sha2 = "0.10"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native"] }
# `default-features = false` più il solo `deflate`: bzip2, zstd, lzma, xz e ppmd
# porterebbero altrettante catene di compilazione C per formati che né una skin
# né un archivio di Spotify usano. Serve a due crate — `rymembra-skin` per i
# pacchetti `.ryskin`, `rymembra-archivio` per i dati che Spotify manda — e sta
# qui perché due versioni diverse dello stesso decompressore nello stesso
# binario sono megabyte duplicati.
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
# Il dominio non ha bisogno di unsafe. Vietato, non scoraggiato: se un giorno
# servisse davvero, deve essere una decisione visibile in questo file.
#
# Ed è servito, una volta: `apps/desktop/rymembra-barra`, i tre pulsanti
# nell'anteprima della barra delle applicazioni. Per metterli bisogna parlare
# COM con la barra e mettersi in mezzo ai messaggi della finestra, e nessuna
# dipendenza seria lo fa al posto nostro — come invece fanno `souvlaki` e
# `trash`. Quel crate non eredita questa tabella: ne ha una sua, uguale tranne
# `unsafe_code = "deny"`, e l'`unsafe` sta in un solo modulo, `finestra.rs`,
# con ogni blocco che dice perché è corretto. Qui sotto non cambia niente, e
# per tutti gli altri crate resta `forbid`.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Le operazioni che possono terminare il processo vanno scritte per esteso.
# Un `unwrap()` in un modulo di dominio non fa cadere una funzione: fa cadere
# l'app dell'utente mentre ascolta.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# La cifratura di «Ascolta insieme» ottimizzata anche nelle build di sviluppo.
#
# Solo questi crate, e solo il livello di ottimizzazione: il codice di Rymembra
# resta in debug come sempre. Senza, ChaCha20-Poly1305 non ottimizzato cifra
# circa 2,7 MB/s — cento volte meno che in rilascio, misurato su 127.0.0.1 da
# `rymembra-insieme/tests/due_pari.rs` — e nelle istanze di prova un salto in
# un MP3 letto in rete, che rilegge il file dall'inizio, costerebbe secondi:
# si proverebbe un programma più lento di quello che si consegna.
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.snow]
opt-level = 3

# I profili di rilascio: il nucleo gira anche su telefono, dove ogni MB
# dell'.so e ogni millisecondo di avvio si vedono.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# `unwind`, e non `abort`, per tre ragioni che si sono viste tutte e tre.
#
# 1. Il database. Con `abort` un panico qualunque, su un filo qualunque, ferma
#    il processo senza eseguire nessun `Drop`: la connessione SQLite non si
#    chiude, il WAL non si consolida. È così che nella cartella dell'utente si
#    è trovato un `rymembra.db-wal` da quattro megabyte e mezzo mai riassorbito.
#
# 2. Il codice si è documentato assumendo `unwind`. `analisi::misura_lotto`
#    scrive che un filo caduto perde solo il suo lotto, e lo scrive perché fa
#    `join().ok()` su fili di scope — che sotto `abort` non viene raggiunto
#    mai, perché il processo è già morto. Delle due andava cambiata una: o la
#    promessa o il profilo. Vale più la promessa.
#
# 3. La decodifica. `symphonia` gira su file che arrivano dal disco di
#    chiunque, e un file malformato che lo faccia panicare, sotto `abort`,
#    porta via l'applicazione intera — e lo rifà a ogni avvio, perché quel
#    brano resta candidato.
#
# Costa qualche decina di kilobyte di tabelle di unwinding. Non cambia le
# prestazioni del codice che non panica, che è tutto quello che gira di solito.
panic = "unwind"
