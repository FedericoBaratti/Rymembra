[package]
name = "rymembra-scrobble"
description = "Lo scrobbling di Rymembra: ListenBrainz e Last.fm, i due protocolli e la firma che uno chiede e l'altro no."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Nessuno di questi crate va su crates.io.
#
# Non è modestia: sono i pezzi di un'applicazione, con nomi che occuperebbero
# uno spazio dei nomi pubblico senza offrire niente a nessuno, e con un patto
# di stabilità che non esiste — le firme qui dentro cambiano quando serve.
# Senza questa riga un `cargo publish` distratto dalla radice li
# pubblicherebbe tutti, e un nome preso su crates.io non si restituisce.
publish = false

[dependencies]
# Solo il catalogo degli errori e la regola di cosa conta come ascolto. Non la
# libreria, non `rusqlite`: la coda dello scrobbling sta in `rymembra-app`, e
# questo crate riceve gli ascolti già pronti. Vedi il preambolo.
rymembra-domain = { path = "../rymembra-domain" }
rymembra-net = { path = "../rymembra-net" }
# MD5, che Last.fm richiede per `api_sig`. Nel workspace c'erano `sha2` e
# `sha1`: sono algoritmi diversi e non servono a questo. Stessa famiglia
# RustCrypto degli altri due, quindi non porta dentro niente di nuovo — il
# tratto `digest` e il suo buffer sono già nell'albero.
md-5 = "0.10"
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
