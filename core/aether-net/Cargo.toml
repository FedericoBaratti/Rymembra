[package]
name = "aether-net"
description = "Il client HTTP di Aether: scadenze, ritentativi e la traduzione di un guasto di rete in un codice del catalogo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Nessuno di questi crate va su crates.io.
#
# Non è modestia: sono i pezzi di un'applicazione, con nomi che occuperebbero
# uno spazio dei nomi pubblico senza offrire niente a nessuno, e con un patto
# di stabilità che non esiste — le firme qui dentro cambiano quando serve.
# Senza questa riga un `cargo publish` distratto dalla radice li
# pubblicherebbe tutti, e un nome preso su crates.io non si restituisce.
publish = false

[dependencies]
# Solo il catalogo degli errori: questo crate non conosce né la libreria né il
# database, e non deve cominciare. È la ragione per cui può stare sotto sia al
# backup su Drive sia all'importazione da Spotify senza legarli fra loro.
aether-domain = { path = "../aether-domain" }
ureq.workspace = true

[lints]
workspace = true
