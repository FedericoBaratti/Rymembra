[package]
name = "rymembra-skin"
description = "Il motore delle skin di Rymembra: da `skin.json` a CSS, e il pacchetto `.ryskin`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Nessuno di questi crate va su crates.io.
#
# Non è modestia: sono i pezzi di un'applicazione, con nomi che occuperebbero
# uno spazio dei nomi pubblico senza offrire niente a nessuno, e con un patto
# di stabilità che non esiste — le firme qui dentro cambiano quando serve.
# Senza questa riga un `cargo publish` distratto dalla radice li
# pubblicherebbe tutti, e un nome preso su crates.io non si restituisce.
publish = false

[dependencies]
rymembra-domain = { path = "../rymembra-domain" }
# Solo per LEGGERE. Nessun tipo di questo crate deriva `Serialize`, ed è una
# scelta: la forma interna non è riserializzabile come sorgente — un colore
# validato è una quaterna di canali, e riscriverlo produrrebbe un manifest che
# la validazione rifiuta. Chi deve conservare la sorgente conserva il JSON.
serde_json.workspace = true
# `default-features = false` più il solo `deflate`: bzip2, zstd, lzma, xz, ppmd
# e aes sarebbero sei decompressori in più esposti a un archivio ostile, per
# leggere formati che il nostro scrittore non produce mai. Restano implementazioni
# in puro Rust, che è anche ciò che serve a compilare per Android senza portarsi
# dietro una libreria C.
zip = { version = "8", default-features = false, features = ["deflate"] }

[lints]
workspace = true
