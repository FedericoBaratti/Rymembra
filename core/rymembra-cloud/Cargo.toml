[package]
name = "rymembra-cloud"
description = "Il backup di Rymembra su Google Drive: OAuth, HTTP, e la cartella privata dell'app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Nessuno di questi crate va su crates.io.
#
# Non è modestia: sono i pezzi di un'applicazione, con nomi che occuperebbero
# uno spazio dei nomi pubblico senza offrire niente a nessuno, e con un patto
# di stabilità che non esiste — le firme qui dentro cambiano quando serve.
# Senza questa riga un `cargo publish` distratto dalla radice li
# pubblicherebbe tutti, e un nome preso su crates.io non si restituisce.
publish = false

[dependencies]
rymembra-app = { path = "../rymembra-app" }
rymembra-domain = { path = "../rymembra-domain" }
# Il client HTTP, che stava qui dentro finché Drive era l'unico a uscire in rete.
rymembra-net = { path = "../rymembra-net" }
# PKCE, il servitore di loopback e il portachiavi: stavano qui dentro finché
# Google era l'unico a chiedere un consenso. Vedi il preambolo di `rymembra-oauth`
# sul perché il confine passa dove passa.
rymembra-oauth = { path = "../rymembra-oauth", default-features = false }
# Le guardie dell'archivio non fidato: un `.ryskin` scaricato passa di lì prima
# di toccare il disco. Vedi `pacchetti`.
rymembra-skin = { path = "../rymembra-skin" }
# Il motore della sincronia. La direzione è questa e non il contrario: chi decide
# cosa sopravvive quando due dispositivi si incontrano non deve sapere che esiste
# un HTTP. Qui si fornisce solo il deposito — `impl Magazzino for Drive`, che è
# cinque righe perché la forma era già quella.
rymembra-sync = { path = "../rymembra-sync" }
flate2.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = ["portachiavi"]
# Il portachiavi di sistema, acceso di serie: una futura build Android lo spegne
# e fornisce il suo, senza portarsi dietro il Credential Manager di Windows.
# L'interruttore vero sta in `rymembra-oauth`; qui si inoltra soltanto, perché chi
# dipende dal backup non deve sapere in quale crate è finito il tratto.
portachiavi = ["rymembra-oauth/portachiavi"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
