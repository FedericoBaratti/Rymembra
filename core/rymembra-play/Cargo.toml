# Il motore audio.
#
# Dipende da `rymembra-domain` e da nient'altro del progetto: in particolare
# **non** da `rymembra-app`. È chi sta sopra a procurargli i byte, e questo è ciò
# che tiene aperta la strada per Android — là i byte arrivano dallo Storage
# Access Framework attraverso lo stesso tratto `MusicFiles`, e il motore non
# deve accorgersene.

[package]
name = "rymembra-play"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Il motore audio di Rymembra: decodifica, uscita, e il tempo che passa."

# Nessuno di questi crate va su crates.io.
#
# Non è modestia: sono i pezzi di un'applicazione, con nomi che occuperebbero
# uno spazio dei nomi pubblico senza offrire niente a nessuno, e con un patto
# di stabilità che non esiste — le firme qui dentro cambiano quando serve.
# Senza questa riga un `cargo publish` distratto dalla radice li
# pubblicherebbe tutti, e un nome preso su crates.io non si restituisce.
publish = false

[dependencies]
rymembra-domain = { path = "../rymembra-domain" }

# La decodifica. Le feature sono l'elenco chiuso di `SUPPORTED_EXTENSIONS` meno
# l'unico che symphonia non sa fare — WMA, che si dichiara non supportato con un
# codice del catalogo invece di fallire in silenzio.
#
# `ogg` vale per tre codec e non per uno: Vorbis, FLAC e Opus viaggiano tutti
# dentro quel contenitore, e il demultiplatore di symphonia li distingue da sé.
# È la ragione per cui `.oga` non è costato una riga di decodifica.
#
# Dalla 0.6 le voci in fondo non si danno più per scontate, e ciascuna ha
# la sua ragione:
#
# - `id3v2`: in 0.5 il lettore dei tag ID3v2 stava sempre nel riconoscitore, in
#   0.6 è una feature. Senza, un MP3 che comincia con un tag viene attraversato
#   byte per byte in cerca di una sincronia — dentro i byte di una copertina, che
#   possono somigliarle — e con un tag più grande di un mega (una copertina
#   grande basta) il riconoscitore si arrende prima di arrivare all'audio. Gli
#   altri due lettori di tag, `id3v1` e `ape`, restano fuori apposta: stanno in
#   coda al file, e per cercarli il riconoscitore salta alla fine e torna — su
#   un flusso di rete sono richieste in più prima del primo suono, per dei tag
#   che il motore non legge (li legge `rymembra-app`, con lofty);
# - `opt-simd`: la FFT di symphonia (le trasformate di AAC e Vorbis) passa per
#   `rustfft`, che nel grafo c'è già per il ricampionatore di rubato. Non è una
#   dipendenza nuova: è la stessa, usata due volte;
# - `mkv` e `caf`: Matroska/WebM e il Core Audio Format di Apple. C'erano già in
#   0.5, spenti; la 0.6 li ha riscritti (il ritardo del codec di Matroska ora
#   si toglie dai timestamp) e dentro portano codec che già decodifichiamo:
#   Opus e Vorbis il primo, PCM, ALAC e AAC il secondo. Il motore li riconosce
#   dal contenuto; `.mka`, `.webm` e `.caf` **non** sono ancora fra le
#   estensioni del dominio, e la ragione sta in `Codec::da_estensione`.
symphonia = { version = "0.6.1", default-features = false, features = [
    "mp3",
    "flac",
    "isomp4",
    "aac",
    "alac",
    "ogg",
    "vorbis",
    "wav",
    "pcm",
    "aiff",
    "id3v2",
    "opt-simd",
    "mkv",
    "caf",
] }

# Il decodificatore Opus, che symphonia continua a non avere nemmeno nella 0.6.
# Il contenitore lo apre già lei: riconosce `OpusHead`, misura la durata di ogni
# pacchetto, e a fine brano dice quanto togliere in coda. Qui manca solo chi
# faccia diventare campioni quei pacchetti.
#
# Rust e non C: niente cmake da installare, niente trenta megabyte di libopus da
# compilare, e niente quattro cross-build in più il giorno che questo crate
# suonerà su Android — che è la ragione per cui non dipende da `rymembra-app`.
#
# **Questo, e non uno degli altri due in Rust.** Sono stati provati tutti e tre
# sullo stesso mazzo di quindici file incisi da libopus: `opus-decoder` va in
# panico su cinque, tutti a bitrate basso; `rusty-opus` restituisce spazzatura
# senza dirlo; `opus-pure` li decodifica tutti, con lo stesso valore efficace
# che ne ricava libopus. La prova sta in `decodifica::opus`, che spiega anche
# cosa si paga — a cominciare dal fatto che «Rust puro» qui non vuol dire
# «senza unsafe».
#
# Esatta perché il crate è nato il 2026-08-27: una 0.2.x nuova ripassa dal mazzo.
opus-pure = "=0.2.1"

# Monkey's Audio (`.ape`), il formato di tante immagini CD accompagnate dal loro
# `.cue`. symphonia ne conosce il nome del codec e basta: il decodificatore lo
# porta questo crate, e `crate::ape` ci mette sopra un lettore di contenitore
# che consegna a symphonia pacchetti già PCM — il decodificatore PCM che c'è già
# fa il resto, senza un codec nuovo nel registro.
#
# Rust e non C per le ragioni di `opus-pure`, e qui «Rust puro» vuol dire anche
# senza `unsafe`: il crate se lo vieta (`#![deny(unsafe_code)]`), e il sorgente
# della 0.3.2 è stato letto per verificarlo. Le sue due dipendenze, `crc32fast`
# e `md-5`, erano già nel grafo.
#
# Si usa **a flusso**: `decode_frame` un fotogramma alla volta, e `seek`, che è
# aritmetica sulla tabella dei salti letta all'apertura. Mai `decode_all`, che
# di un'immagine da settanta minuti farebbe settecento megabyte in memoria. La
# prova che decodifica come ffmpeg sta in `examples/ape_md5.rs`.
#
# Un limite, dichiarato: decodifica i file scritti dalla 3.99 in su, non quelli
# fra la 3.95 e la 3.98 che dice di accettare. Vedi `ape::VERSIONE_MINIMA`.
#
# Esatta per la stessa ragione di `opus-pure`: il sorgente letto è questo, e una
# 0.3.x nuova ripassa dalla lettura e dal confronto con ffmpeg.
ape-decoder = "=0.3.2"

# L'uscita. WASAPI qui, AAudio quando ci sarà Android: è la ragione per cui il
# dispositivo sta dietro questa libreria e non dietro una chiamata di sistema.
#
# Almeno la 0.18.2, e non la 0.18.0: è la prima in cui `play` e `pause` su
# WASAPI non vanno in panico a dispositivo sparito — e da quando il flusso si
# mette a riposo quelle due chiamate le facciamo davvero, vedi `uscita.rs`.
cpal = "0.18.2"

# Il ricampionamento, che non è un lusso: il dispositivo apre a una frequenza
# sola e i file ne hanno una loro. Senza, due brani a frequenze diverse non
# possono attaccarsi senza buco.
rubato = "0.16"

# La misura dell'intensità percepita: EBU R128 / ITU-R BS.1770, con il picco
# vero. È il port in Rust di libebur128, la stessa misura che fanno foobar2000,
# ffmpeg e i programmi di ReplayGain 2.0 — quindi un numero confrontabile con
# quello scritto nei tag da chiunque altro. Vedi `intensita`.
ebur128 = "0.1.10"

# L'anello fra il filo che decodifica e la callback che suona. Senza lucchetti:
# prendere un mutex dentro una callback audio significa che, se il proprietario
# viene sospeso, l'audio si interrompe.
rtrb = "0.3"

[dev-dependencies]
tempfile = "3"
# L'impronta del PCM in `examples/ape_md5.rs`, da confrontare con quella di
# ffmpeg. È la stessa versione che `ape-decoder` porta già nel grafo.
md-5 = "0.10"

[lints]
workspace = true

# Due esempi hanno delle prove loro, sui conti che fanno da sé: senza
# `test = true` `cargo test` li compilerebbe e basta, e le prove non
# girerebbero mai. Si eseguono solo le `#[test]`: il `main` — che apre i
# dispositivi o scrive un file — resta fuori. Gli altri esempi restano quel che
# erano, trovati da soli.
[[example]]
name = "insieme_locale"
test = true

[[example]]
name = "genera_clic"
test = true
