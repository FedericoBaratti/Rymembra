[package]
name = "rymembra-app"
description = "Orchestrazione di Rymembra: database, rete, filesystem. Il dominio sta in rymembra-domain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Nessuno di questi crate va su crates.io.
#
# Non è modestia: sono i pezzi di un'applicazione, con nomi che occuperebbero
# uno spazio dei nomi pubblico senza offrire niente a nessuno, e con un patto
# di stabilità che non esiste — le firme qui dentro cambiano quando serve.
# Senza questa riga un `cargo publish` distratto dalla radice li
# pubblicherebbe tutti, e un nome preso su crates.io non si restituisce.
publish = false

[dependencies]
rymembra-domain = { path = "../rymembra-domain" }
# I servizi di metadati. Non `rymembra-net`: questo crate non fa richieste da sé,
# le fa fare a `rymembra-meta` — che a sua volta non vede `rusqlite`, ed è quel
# che rende impossibile tenere il lucchetto della libreria mentre si aspetta
# una risposta da MusicBrainz.
rymembra-meta = { path = "../rymembra-meta" }
rymembra-play = { path = "../rymembra-play" }
# La fusione fra dispositivi. Non vede `rusqlite` e non parla con la rete: qui si
# costruisce il documento leggendo il database, là si decide cosa sopravvive, e
# chi porta i byte in giro è `rymembra-cloud`. Le tre cose restano separabili, ed è
# il motivo per cui la fusione si prova senza né disco né rete.
rymembra-sync = { path = "../rymembra-sync" }
blake3.workspace = true
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "rayon"] }
imagesize = "0.15.0"
lofty = "0.25.4"
# `bundled`: SQLite compilato da sorgente e incluso nel binario. Non è comodità
# — è l'unico modo di avere la STESSA versione di SQLite e le stesse opzioni di
# compilazione sul desktop e dentro l'APK. Su Android il SQLite di sistema
# cambia da versione a versione, e FTS5 non è garantito: è il motivo per cui il
# vecchio porting doveva ripiegare su `LIKE` per la ricerca.
#
# La versione conta quanto l'opzione: la 0.40 porta dentro SQLite 3.53.2, che
# chiude CVE-2026-11824, un traboccamento di memoria dentro FTS5. Non è una
# teoria per Rymembra: `import_legacy` apre un database che non ha scritto lui —
# quello della versione rilasciata, scelto dall'utente — e un file preparato
# apposta arriverebbe lì.
#
# `cache` scritta per esteso anche se è fra quelle di serie: dalla 0.38 la
# cache delle istruzioni è facoltativa, e `prepare_cached` — una cinquantina di
# chiamate, da `library.rs` in giù — senza di lei non esiste. Le altre di serie
# si spengono: portano solo `sqlite-wasm-rs`, che serve a WebAssembly nel
# browser.
#
# Nemmeno `fallible_uint`, e non serve: dalla 0.38 `u64` e `usize` non passano
# più da soli verso SQLite (che ha solo interi con segno), e nessuna riga di
# questo crate ce li faceva passare.
rusqlite = { version = "0.40", default-features = false, features = [
    "bundled",
    "cache",
    "functions",
] }
# Il dominio non serializza niente da sé, ed è una regola che vale per il
# dominio: là una `derive` costringerebbe le decisioni pure ad avere
# un'opinione su come vengono trasmesse. Qui è diverso — questo crate esiste
# per parlare col mondo, e i tipi di lettura della libreria attraversano l'IPC
# verso la finestra e il ponte verso Android. Rimirarli a mano da ogni
# consumatore sarebbe la duplicazione che questo ramo esiste per togliere.
serde.workspace = true
serde_json.workspace = true
# La normalizzazione NFC dei tag appena letti (`metadata::clean`). La stessa
# versione che il dominio usa già per piegare il testo: un crate in più nel
# grafo non c'è, c'è solo una riga in più qui.
unicode-normalization.workspace = true
walkdir = "2.5.0"
# L'archivio del profilo (`.ryprofile`). Le opzioni sono quelle già scelte in
# `[workspace.dependencies]` per `rymembra-skin`: `default-features = false` più
# il solo `deflate`, così i cinque compressori che non useremmo mai non entrano
# nel binario. Qui serve **anche** perché è l'unico formato che si sa scrivere e
# rileggere in streaming senza tenere l'archivio in memoria: un profilo con le
# copertine può pesare centinaia di megabyte, e il vincolo di questa release è
# che la memoria a riposo non cambi.
zip.workspace = true

[dev-dependencies]
# Solo per l'esempio `archivio`, che deve pur aprire uno zip da qualche parte.
# In `[dev-dependencies]` e non fra le dipendenze vere: la regola del crate è
# che chi scrive nel database non legge dal mondo, e `import_account` riceve
# infatti un `AccountSnapshot` già pronto senza sapere chi l'abbia riempito. Un
# esempio è un programma a parte, ed è il posto giusto per far incontrare le due
# metà — come `importa.rs` fa già con il vecchio database.
rymembra-archivio = { path = "../rymembra-archivio" }
rymembra-net = { path = "../rymembra-net" }
# Serve a datare un file di prova: due scritture di fila cadono nello stesso
# millisecondo, e il piano di scansione le vedrebbe come «invariato».
filetime = "0.2"
tempfile = "3"

[lints]
workspace = true
