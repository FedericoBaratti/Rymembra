# I cataloghi liberi: l'unico posto dell'albero che va a prendere dei byte
# musicali.
#
# Sostituisce `rymembra-yt`, e la differenza che conta non e` quale servizio si
# interroga: e` che qui non c'e` nessun processo figlio e nessun binario da
# impacchettare nell'installer. Tutto passa da `rymembra-net`, cioe` da `ureq`,
# cioe` da richieste HTTP che si leggono nel codice.
#
# Non vede `rusqlite`, come `rymembra-cloud` e `rymembra-archivio`: e` il verso della
# dipendenza a rendere impossibile — e non solo sconsigliato — tenere preso il
# lucchetto della libreria per il minuto che dura un prelievo.

[package]
name = "rymembra-catalogo"
description = "I cataloghi liberi da cui Rymembra prende la musica: Internet Archive, Jamendo, Audius."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Nessuno di questi crate va su crates.io.
#
# Non è modestia: sono i pezzi di un'applicazione, con nomi che occuperebbero
# uno spazio dei nomi pubblico senza offrire niente a nessuno, e con un patto
# di stabilità che non esiste — le firme qui dentro cambiano quando serve.
# Senza questa riga un `cargo publish` distratto dalla radice li
# pubblicherebbe tutti, e un nome preso su crates.io non si restituisce.
publish = false

[dependencies]
rymembra-domain = { path = "../rymembra-domain" }
rymembra-net = { path = "../rymembra-net" }
serde_json.workspace = true

[features]
# Jamendo sta dietro un interruttore, e non per gusto di configurabilita`: la
# loro API e` gratuita per i soli usi non commerciali, e «non commerciale» e` una
# proprieta` del progetto che lo usa, non di questo codice.
#
# **Spenta di serie, e il perche` non e` tecnico.** I loro termini definiscono
# l'uso commerciale come «any monetary compensation»; Rymembra si sostiene con le
# donazioni. Se contino o no e` una domanda a cui deve rispondere Jamendo — la
# si e` posta a `licensing@jamendo.com`, vedi README e TERMS § 2 — e finche` non
# ha risposto, un installer che usa quell'API a condizioni ignote e`
# precisamente il genere di cosa per cui questo programma e` stato riscritto.
#
# Il codice c'e` ed e` provato: `cargo test -p rymembra-catalogo --features jamendo`.
# Il giorno della risposta, questa riga diventa `default = ["jamendo"]`.
default = []
jamendo = []

[lints]
workspace = true
