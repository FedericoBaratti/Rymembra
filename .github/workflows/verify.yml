# Quel che deve passare prima di unire qualcosa — e prima di ogni release.
#
# Gira su Windows, ed è deliberato: è il bersaglio dell'installer, e una matrice
# che compila su Linux darebbe la sensazione di coprire una piattaforma che
# nessuno spedisce. L'altra cosa che si spedisce è l'APK per i telefoni, e ha il
# suo lavoro, `android`, più sotto: su Linux perché è lì che l'immagine di GitHub
# ha già l'SDK e l'NDK, e perché il Rust che compila è quello del telefono, non
# quello di Linux.

# Le azioni sono inchiodate a un hash, e il perché sta per esteso nel preambolo
# di `release.yml`: un'etichetta come `@v4` si può spostare, un hash no. Qui non
# passa nessun segreto, ma è la stessa CI che dice «si può unire» — e un'azione
# sostituita sotto i piedi lo direbbe di qualunque cosa.
#
# Tutte su Node 24: GitHub spegne il runtime Node 20 delle azioni, e un'azione
# ferma a Node 20 smette di partire il giorno in cui lo fa, non prima.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  # Perché si possa lanciare a mano quando si sospetta che la cache menta.
  workflow_dispatch:
  # Perché `release.yml` la chiami prima di costruire: una release che parte
  # senza che le prove siano passate **su quel tag** è una release che si fida
  # dell'ultima volta che qualcuno ha guardato un ramo.
  workflow_call:
    inputs:
      ref:
        description: "Il ref da verificare (vuoto = quello dell'evento)"
        type: string
        required: false
        default: ""
      # Gli avvisi di sicurezza sulle dipendenze (`cargo deny check
      # advisories`, `npm audit`) consultivi invece che bloccanti: lo chiede
      # solo `release.yml`, vedi il lavoro `dipendenze`.
      consultivo:
        description: "Gli avvisi di sicurezza delle dipendenze non fermano la corsa: si scrivono nel riepilogo"
        type: boolean
        required: false
        default: false
    outputs:
      avvisi:
        description: "«nessuno» o «trovati»: l'esito di cargo deny advisories e npm audit"
        value: ${{ jobs.dipendenze.outputs.avvisi }}

# Leggere l'albero e basta. Nessun lavoro qui scrive niente su GitHub.
permissions:
  contents: read

# Un push nuovo sullo stesso ramo rende vecchio quello di prima: verificarlo
# fino in fondo è un'ora di macchina per una risposta che nessuno leggerà.
# `github.workflow` nel gruppo perché, chiamata da `release.yml`, questa corsa
# porta il nome di chi la chiama e non deve annullare né essere annullata da
# una verifica di un ramo.
concurrency:
  group: verify-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Le prove non toccano la rete: se una lo facesse, deve fallire qui e non
  # sulla macchina di qualcuno tre settimane dopo.
  RUSTFLAGS: "-D warnings"

jobs:
  verifica:
    runs-on: windows-latest
    # Sessanta: i quarantacinque erano misurati sulla 3.2.0, con 707 pacchetti
    # nel lockfile; oggi sono 844 (iroh, il porting Android), e un tag spinto
    # insieme a `main` trova la cache non ancora scritta e compila tutto.
    timeout-minutes: 60
    env:
      # La versione di Rust inchiodata, e non «stable»: una CI che un martedì
      # mattina comincia a fallire perché è uscito un clippy nuovo è una CI
      # rossa per una ragione che non sta nel cambio che si sta guardando. La
      # variabile vince su `rust-toolchain.toml`, che sulla macchina di chi
      # sviluppa resta `stable`; la si alza a mano, insieme a `rust-version` se
      # serve, e insieme a quella di `release.yml`. Lo stesso valore torna nei
      # lavori `android` e `dipendenze`: tre righe da alzare insieme.
      RUSTUP_TOOLCHAIN: "1.97.1"

    steps:
      # Senza credenziali nel `.git/config`: nessun passo di questo lavoro ha
      # bisogno di parlare con GitHub, e un token lasciato su disco è un token
      # che ogni script di compilazione di quattrocento crate può leggere.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # `rustup` c'è già sull'immagine: installare la versione inchiodata con
      # lui è un'azione di terzi in meno fra il codice e la CI.
      - name: Rust
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24 e non 20: le prove dell'interfaccia sono TypeScript eseguito da
          # `node --test` senza compilarlo, e Node lo fa da sé dalla 23.6 in poi.
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # ── prima le cose che costano un secondo ─────────────────────────────
      # L'ordine non è casuale: un disallineamento di versione o di formato si
      # scopre in tre secondi, e scoprirlo dopo venti minuti di compilazione è
      # venti minuti buttati.

      - name: Le versioni coincidono
        run: node strumenti/versione.js

      - name: Le lingue dicono tutte le stesse cose
        run: node strumenti/lingue.js

      # Le novità della finestra «Novità» (`apps/desktop/src/novita.ts`): da due a
      # quattro passi, i testi in italiano e in inglese, nessuna chiave rimasta di
      # una versione di prima. Una versione che ne è senza è un avviso, non un
      # errore: vedi `strumenti/novita.js`.
      - name: Le novità sono scritte bene
        run: node strumenti/novita.js

      # Lo script `verify` di `package.json` lo esegue da sempre; qui mancava, e
      # una classe che nessun foglio disegna passava `tsc`, passava `vite build`
      # e arrivava fino alla schermata storta.
      - name: Le classi CSS esistono
        run: node strumenti/classi.js

      # Anche questo lo eseguiva solo `npm run verify`. La documentazione cita i
      # file del repository per percorso, e il «?» delle Impostazioni apre le sue
      # ancore: un file rinominato o un'ancora sparita si vedono qui.
      - name: La documentazione dice il vero
        run: node strumenti/docs.js

      # Le note che l'updater mostrerà, ricavate dal changelog: se la sezione di
      # questa versione non ha titoli, l'avviso «c'è un aggiornamento» si apre
      # su una tendina vuota. Meglio saperlo a ogni push che la sera del tag.
      - name: Gli strumenti di rilascio
        run: node --test "strumenti/*.test.js"

      - name: Formattazione
        run: cargo fmt --all --check

      # ── e poi quelle che costano ─────────────────────────────────────────
      # `--locked` dappertutto: un `Cargo.lock` che la CI riscrive in silenzio
      # vuol dire che le prove sono passate su dipendenze diverse da quelle che
      # l'installer conterrà.

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Prove
        run: cargo test --workspace --locked

      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build:web
          npm run test:web

      # Dopo `npm ci`, perché `licenze.js` legge i testi dei pacchetti npm che
      # finiscono nel programma da `node_modules`. Era un controllo della sola
      # release: scoprire al momento del tag che tre aggiornamenti di
      # dipendenze fa qualcuno non ha rigenerato gli avvisi vuol dire una
      # release ferma per un file di testo.
      - name: Gli avvisi sulle licenze sono aggiornati
        shell: bash
        run: |
          node strumenti/licenze.js
          if ! git diff --quiet -- THIRD-PARTY-NOTICES.md; then
            echo "THIRD-PARTY-NOTICES.md non è aggiornato."
            echo "Rigenerarlo con: node strumenti/licenze.js"
            git --no-pager diff --stat -- THIRD-PARTY-NOTICES.md
            exit 1
          fi

  # Il telefono. Fino a qui la CI non compilava mai il codice che esiste solo su
  # Android — `telefono.rs`, i rami `cfg(target_os = "android")`, il ponte
  # `rymembra-android` con il suo `unsafe` — né il Kotlin: si scopriva rotto la
  # prima volta che qualcuno costruiva un APK, settimane dopo il cambio che
  # l'aveva rotto. Prima clippy sul bersaglio del telefono, che costa poco e
  # dice dove; poi l'APK vero, con la CLI di Tauri come lo si costruisce a mano
  # (README, «Android»), e il lint di Android sul progetto Gradle — che senza
  # la CLI non si può nemmeno aprire: `tauri.settings.gradle`, le classi
  # generate di wry e `tauri.properties` li scrive lei, e non stanno nel
  # repository.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Lo stesso Rust del lavoro `verifica`: vedi lì perché è inchiodato.
      RUSTUP_TOOLCHAIN: "1.97.1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --component clippy
          rustup target add aarch64-linux-android --toolchain ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # L'NDK e il JDK 17 sono già sull'immagine: `ANDROID_NDK_LATEST_HOME` e
      # `JAVA_HOME_17_X64` sono le sue variabili. Il compilatore C dell'NDK
      # serve a SQLite e a `ring`, che hanno sorgenti C da compilare per il
      # telefono; il linker al `.so` dell'app. L'API 26 è quella di
      # `minSdkVersion` (`tauri.android.conf.json`).
      - name: L'NDK
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME"
            echo "JAVA_HOME=$JAVA_HOME_17_X64"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      # `generate_context!` legge la finestra costruita: senza `dist` l'app non
      # compila, nemmeno per clippy.
      - name: La finestra
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build:web

      - name: Clippy, sul telefono
        run: cargo clippy -p rymembra-desktop -p rymembra-android --target aarch64-linux-android --locked

      # In debug: un APK di rilascio vuole la chiave di chi pubblica
      # (`keystore.properties`), che qui non c'è e non deve esserci. Quel che si
      # verifica è che tutto compili e si impacchetti, non quanto pesa.
      - name: L'APK
        working-directory: apps/desktop
        run: npx tauri android build --apk --target aarch64 --debug --ci

      - name: Il lint di Android
        working-directory: apps/desktop/src-tauri/gen/android
        run: ./gradlew :app:lintArm64Debug -x rustBuildArm64Debug --no-daemon

  # Le dipendenze, guardate da fuori: licenze, avvisi di sicurezza, crate ritirati,
  # sorgenti. Un lavoro suo perché fallisce per ragioni che non stanno nel
  # codice di questo repository — un avviso pubblicato stanotte su un crate che
  # non è cambiato — e va letto come tale.
  #
  # # Bloccante sui rami, consultivo nella release
  #
  # Licenze, divieti e sorgenti dipendono dal codice di questo repository:
  # fermano sempre. Gli avvisi di sicurezza (e i crate ritirati, che
  # `cargo-deny` mette fra gli avvisi) e `npm audit` dipendono invece dal giorno:
  # il DB di RustSec e quello di npm si scaricano al momento, e un avviso uscito
  # il giorno del tag fermava la release in un modo da cui «Re-run» non esce —
  # rilancia lo stesso tag, con lo stesso `deny.toml`, e un tag non si sposta.
  # Chiamata da `release.yml` (`consultivo: true`) questa corsa li scrive nel
  # riepilogo e passa l'esito in `avvisi`, che la bozza mostra in testa a chi
  # la pubblica: il cancello umano c'è già, ed è quello. Sui rami, sulle pull
  # request e da `msix.yml` restano bloccanti.
  dipendenze:
    runs-on: ubuntu-latest
    # Venticinque e non dieci: `cargo-deny` si compila (vedi sotto), e la
    # corsa gira accanto a `verifica`, che ne dura quaranta.
    timeout-minutes: 25
    outputs:
      avvisi: ${{ steps.esito.outputs.avvisi }}
    env:
      # Lo stesso Rust del lavoro `verifica`: vedi lì perché è inchiodato.
      # Qui compila `cargo-deny` e risponde al suo `cargo metadata`.
      RUSTUP_TOOLCHAIN: "1.97.1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Rust
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal

      # `cargo-deny` compilato da crates.io, e non più l'azione contenitore di
      # Embark. Il suo hash inchiodava il Dockerfile, non quel che il
      # Dockerfile scaricava a ogni corsa: il binario da un asset di release,
      # senza nessuna impronta, e i pacchetti Alpine senza versione. Un asset
      # sostituito avrebbe dato un `cargo deny` che dice sempre «ok»: un
      # cancello che mente. Una versione pubblicata su crates.io invece non si
      # può più cambiare, cargo ne verifica l'impronta sull'indice, e
      # `--locked` prende le dipendenze dal `Cargo.lock` che il crate porta con
      # sé. La versione è quella che l'azione scaricava, e si alza a mano come
      # gli hash delle azioni.
      #
      # Fuori dal repository, perché una `.cargo/config.toml` di qui (un
      # `build.target`, un linker) non decida come si compila lo strumento; e
      # senza `-D warnings`, che è una regola per il codice di Rymembra, non
      # per quello di un altro.
      - name: cargo-deny, dal suo lockfile
        working-directory: ${{ runner.temp }}
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-deny --version 0.20.2 --locked

      # Gli stessi argomenti con cui la chiamava l'azione: `--all-features` era
      # il suo `arguments` di serie, e toglierlo cambierebbe il grafo che si
      # guarda. Gira su Linux, ma i bersagli che guarda sono Windows e il
      # telefono, perché lo dice `deny.toml` (`[graph] targets`).
      - name: cargo deny, licenze, divieti e sorgenti
        run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check bans licenses sources

      - name: cargo deny, avvisi di sicurezza
        id: rustsec
        continue-on-error: ${{ inputs.consultivo == true }}
        run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check advisories

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Solo le dipendenze che finiscono nella finestra: un avviso su uno
      # strumento di compilazione (`vite`, `typescript`) non tocca chi installa
      # Rymembra, e una CI rossa per quello si impara a ignorarla.
      - name: npm audit
        id: npm
        continue-on-error: ${{ inputs.consultivo == true }}
        working-directory: apps/desktop
        run: npm audit --omit=dev

      # `outcome` e non `conclusion`: con `continue-on-error` la seconda dice
      # sempre «success», la prima dice com'è andata davvero.
      - name: L'esito degli avvisi
        id: esito
        if: always()
        env:
          RUSTSEC: ${{ steps.rustsec.outcome }}
          NPM: ${{ steps.npm.outcome }}
        run: |
          if [ "$RUSTSEC" = "success" ] && [ "$NPM" = "success" ]; then
            echo "avvisi=nessuno" >> "$GITHUB_OUTPUT"
          else
            echo "avvisi=trovati" >> "$GITHUB_OUTPUT"
            {
              echo "### Avvisi sulle dipendenze"
              echo ""
              echo "- cargo deny check advisories: $RUSTSEC"
              echo "- npm audit --omit=dev: $NPM"
              echo ""
              echo "Il dettaglio è nel registro dei due passi qui sopra."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Un lavoro suo, e non un passo del precedente: fallisce per una ragione
  # diversa — qualcuno ha reintrodotto una dipendenza che non si può usare — e
  # leggere «verifica: fallita» senza sapere quale delle due cose non torna è
  # esattamente il modo di ignorare una CI.
  niente-di-vietato:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Le tre cose che hanno reso Rymembra indistribuibile, e che non devono
      # tornare. Il grep esclude i commenti che *spiegano* perché non ci sono:
      # quelli valgono, ed è giusto che restino.
      - name: Nessun binario impacchettato
        run: |
          if [ -d apps/desktop/src-tauri/resources/bin ]; then
            echo "resources/bin esiste di nuovo: vedi .gitignore e CHANGELOG"
            exit 1
          fi
          if grep -q '"resources/bin' apps/desktop/src-tauri/tauri.conf.json; then
            echo "tauri.conf.json impacchetta di nuovo dei binari"
            exit 1
          fi

      # Dove si guarda, uguale nei due passi: tutto `core` e tutto
      # `apps/desktop`. Un elenco di cartelle scritto a mano lasciava fuori due
      # crate del workspace (`rymembra-android`, `rymembra-barra`) e il Kotlin
      # dell'app Android (`src-tauri/gen/android`, `.kt` e `.kts`): un ritorno
      # lì passava verde. Fuori restano solo dipendenze e uscite di
      # compilazione, che in questa corsa non ci sono ma sulla macchina di chi
      # lo rilancia a mano sì.
      - name: Nessuno strumento di scaricamento
        run: |
          colpi=$(grep -rniE 'yt-dlp|ytdlp|spotdl|innertube|pathfinder|googlevideo' \
            core apps/desktop \
            --include='*.rs' --include='*.ts' --include='*.tsx' --include='*.kt' --include='*.kts' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=target --exclude-dir=build \
            | grep -vE '^\S+: *(//!?|///|\*|#|--) ' || true)
          if [ -n "$colpi" ]; then
            echo "$colpi"
            echo
            echo "Qualcuno ha rimesso uno strumento di scaricamento non lecito."
            echo "Se è solo un commento storico, mettilo su una riga di commento."
            exit 1
          fi

      # I cataloghi di testi che non si possono usare: o vogliono una licenza
      # editoriale che un lettore locale non ha, o si leggono soltanto
      # raschiando una pagina scritta per un browser. LRCLIB non è nell'elenco
      # perché è l'unico con un'API pubblica fatta per i lettori — vedi TERMS.
      - name: Nessuna fonte di testi vietata
        run: |
          colpi=$(grep -rniE 'musixmatch|genius\.com|azlyrics|lyricfind|music\.163|netease|kugou' \
            core apps/desktop \
            --include='*.rs' --include='*.ts' --include='*.tsx' --include='*.kt' --include='*.kts' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=target --exclude-dir=build \
            | grep -vE '^\S+: *(//!?|///|\*|#|--) ' || true)
          if [ -n "$colpi" ]; then
            echo "$colpi"
            echo
            echo "Qualcuno ha aggiunto una fonte di testi che non si può usare."
            echo "Se è solo un commento storico, mettilo su una riga di commento."
            exit 1
          fi

      - name: I documenti pubblici ci sono
        run: |
          for f in LICENSE THIRD-PARTY-NOTICES.md README.md PRIVACY.md TERMS.md \
                   SECURITY.md apps/desktop/src/font/OFL.txt; do
            if [ ! -s "$f" ]; then
              echo "manca o è vuoto: $f"
              exit 1
            fi
          done
