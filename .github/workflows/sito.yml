# Il sito, su GitHub Pages.
#
# # Perché non parte da un push
#
# Perché la pagina dice «è uscito», e finché non è uscito sarebbe una bugia.
# Un workflow legato a `push` la manderebbe online nel momento in cui qualcuno
# committa una virgola in `site/`, che è un momento scelto a caso rispetto a
# quello in cui esiste davvero un installer da scaricare — e il bottone
# «Scarica per Windows» punterebbe a `/releases/latest`, che senza release
# pubblicate è una pagina vuota.
#
# Parte quindi da `release: published`, che è lo stesso gesto che spedisce
# l'aggiornamento a tutti (vedi il preambolo di `release.yml`): una persona
# guarda la bozza, la pubblica, e da lì il sito e l'installer diventano veri
# nello stesso istante.
#
# `workflow_dispatch` resta per le correzioni al sito fra una release e
# l'altra: un refuso non deve aspettare la versione dopo.
#
# # Che versione annuncia
#
# Quella della release pubblicata, non quella a cui è arrivato il codice. Una
# correzione lanciata a mano quando `main` dice già 3.0.2, e la 3.0.2 non è
# uscita, deve continuare a offrire la 3.0.1: il pulsante «Scarica» linka
# l'installer di quella versione, e uno che non esiste è un 404. Per questo il
# tag arriva da fuori — dall'evento della release, o dall'ultima release
# pubblicata — e `strumenti/sito.js` lo riceve con `--versione`.
#
# # Cosa si pubblica
#
# `site/` è il sorgente; `strumenti/sito.js` ne costruisce `_site/` (le pagine
# nelle quattro lingue, un capitolo della documentazione per pagina, la
# sitemap) e si carica quella. Se un controllo del generatore fallisce, non si
# pubblica niente.
#
# # Il deploy da un tag
#
# L'evento `release` gira sul ref del tag (`refs/tags/v…`), e l'ambiente
# `github-pages` per difetto accetta solo il ramo principale: in *Settings →
# Environments → github-pages* va aggiunta la regola per i tag `v*`, o questo
# lavoro si ferma con «Tag … is not allowed to deploy to github-pages».
#
# # Prima che funzioni
#
# In *Settings → Pages* del repository, «Source» va messo su **GitHub Actions**.
# Senza, questo lavoro fallisce all'ultimo passo con un messaggio che parla di
# permessi e non di configurazione.

name: sito

on:
  release:
    types: [published]
  workflow_dispatch:

# Le due che Pages vuole, e nient'altro: `contents: read` per leggere l'albero,
# `pages` e `id-token` per il caricamento firmato.
permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta, e senza annullare quella in corso: interrompere
# un caricamento a metà lascerebbe il sito nello stato di nessuno dei due.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    # Dieci per costruire e caricare, e altri dieci al massimo per aspettare
    # che la pagina servita sia quella nuova: vedi l'ultimo passo.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}

    steps:
      # Inchiodate a un hash come tutte le altre, e il perché sta per esteso nel
      # preambolo di `release.yml`: un'etichetta si può spostare, un hash no.
      # La stessa versione degli altri workflow, e senza lasciare il token nella
      # configurazione di git: qui git non scrive niente, e `gh` usa il suo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lo stesso Node di `verify.yml`: il generatore è CommonJS senza
      # dipendenze, ma usa `Intl` per scrivere le date in quattro lingue.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Il tag della release che si sta pubblicando; a mano, l'ultima
      # pubblicata (`gh release view` senza argomenti salta le bozze).
      - name: La versione da annunciare
        id: versione
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_EVENTO: ${{ github.event.release.tag_name }}
        run: |
          tag="$TAG_EVENTO"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Si annuncia $tag"

      # L'installer di quella release, perché la pagina ne dica il peso e
      # l'impronta SHA-256 misurandoli sul file che il pulsante scarica, e non
      # copiandoli da qualche altra parte.
      - name: L'installer da descrivere
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versione.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*_x64-setup.exe' --dir "$RUNNER_TEMP/installer"

      # Il tag passa da una variabile e non dentro lo script: un nome di tag
      # finisce nella shell come dato, non come codice.
      - name: Il sito si costruisce
        env:
          TAG: ${{ steps.versione.outputs.tag }}
        run: node strumenti/sito.js --versione "$TAG" --installer "$RUNNER_TEMP/installer"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Si carica `_site/` e basta. Non la radice: là dentro ci sono il
      # sorgente, il changelog e i documenti, e Pages li servirebbe tutti a
      # chiunque indovini un percorso. Sono già pubblici sul repository — ma
      # pubblicarli due volte da due indirizzi diversi è il modo di averne una
      # copia vecchia in giro per sempre.
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - id: pubblicazione
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # Un deploy «riuscito» non vuol dire che online ci sia questa build. Con la
      # 3.1.0 il lavoro partito dalla release — sullo stesso commit di un lancio
      # a mano della sera prima, che aveva annunciato la 3.0.2 — è finito verde,
      # e Pages ha continuato a servire la build della sera prima: il sito ha
      # offerto la 3.0.2 per ore, e nessuno lo sapeva.
      #
      # Si confronta quindi la pagina servita, byte per byte, con
      # `_site/index.html` appena costruito: così si vede anche una correzione
      # fra due release che non arriva online, che con lo stesso numero di
      # versione un confronto sul numero non vedrebbe. Senza `--compressed`,
      # perché Pages serve il file così com'è solo a chi non chiede gzip. Per
      # dieci minuti al massimo, quanto la cache davanti a Pages tiene una
      # pagina (`max-age=600`).
      - name: Online c'è questa build
        env:
          URL: ${{ steps.pubblicazione.outputs.page_url }}
        run: |
          attesa=$(sha256sum _site/index.html | cut -d' ' -f1)
          for _ in $(seq 1 40); do
            servita=$(curl -fsS "$URL" | sha256sum | cut -d' ' -f1) || servita=""
            if [ "$servita" = "$attesa" ]; then
              echo "Online c'è la build appena costruita ($attesa)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::$URL serve ancora una build diversa da questa. Di solito è un deploy dello stesso commit di uno già pubblicato: serve un commit nuovo su main, poi «sito» a mano."
          exit 1
