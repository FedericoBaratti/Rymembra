# Da un tag a un installer scaricabile.
#
# # Cosa non fa ancora, e perché è scritto qui e non altrove
#
# **Non firma il codice.** Il blocco `bundle.windows.signCommand` in
# `tauri.conf.json` non c'è, perché un certificato OV richiede la validazione
# dell'identità di chi lo chiede — settimane, e un costo annuo. Finché non c'è,
# **SmartScreen mostra un avviso a chiunque scarichi**, ed è il singolo motivo
# per cui la maggior parte delle applicazioni indipendenti non viene installata.
# La release lo dice nel proprio corpo invece di lasciarlo scoprire.
#
# # L'updater, e la cosa da sapere prima di premere «pubblica»
#
# La release nasce **bozza**, e questo interagisce con l'updater in un modo che
# conviene aver capito: `plugins.updater.endpoints` punta a
# `/releases/latest/download/latest.json`, e `/releases/latest` **salta le
# bozze**. Finché la release resta bozza, quindi, nessuna copia installata di
# Rymembra la vede: si può scaricare l'installer a mano dalla pagina, provarlo, e
# accorgersi che qualcosa non va senza che nel frattempo si sia aggiornato
# nessuno.
#
# Pubblicare la bozza **è** il gesto che spedisce l'aggiornamento a tutti. Non è
# un effetto collaterale da correggere: è l'unico momento in cui una persona
# guarda la cosa prima che parta, ed è messo lì apposta.
#
# # Perché le azioni sono inchiodate a un hash e non a un'etichetta
#
# Perché `actions/checkout@v4` non nomina una versione: nomina un'**etichetta**,
# e chi possiede quel repository può spostarla su un altro commit senza che qui
# cambi una riga. Non è un timore di scuola: nel marzo del 2025 le etichette di
# `tj-actions/changed-files` sono state riscritte, e ventitremila repository
# hanno eseguito codice nuovo credendo di eseguire quello di prima.
#
# Il prezzo è che le azioni non si aggiornano più da sole. Si aggiornano a mano,
# leggendo la versione dal commento accanto all'hash.
#
# # Cinque lavori, e perché la chiave ne vede uno solo
#
#   tag → verifica → costruisci → firma → pubblica
#
# La chiave di firma dell'updater sta nei segreti del repository come
# `TAURI_SIGNING_PRIVATE_KEY` e `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`. La privata
# non è recuperabile e non è sostituibile: gli eseguibili già installati si
# fidano solo di quella, e perderla vuol dire che nessuno di loro si aggiornerà
# mai più — andrebbero tutti reinstallati a mano. Una copia fuori da questo
# computer e fuori da GitHub.
#
# Fino alla 2.4 la chiave stava nell'ambiente di `tauri build`: cioè accanto
# agli script di compilazione di quattrocento crate e ai pacchetti npm, ognuno
# dei quali esegue codice suo. Adesso `costruisci` produce l'installer **senza**
# chiave e lo consegna come artefatto; `firma` gira su una macchina pulita,
# installa solo la CLI di Tauri dal lockfile senza eseguirne gli script, e firma
# con `tauri signer sign`. Sulla macchina che ha compilato la chiave non arriva
# mai.
#
# Lo stesso per il permesso di scrivere sul repository: lo ha solo `pubblica`,
# che non esegue codice del repository. Tutti gli altri leggono e basta.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Il tag da rilasciare, per esempio v3.0.0"
        required: true

# Niente per nessuno, e ogni lavoro chiede il suo: un `contents: write` in cima
# lo darebbe anche al lavoro che compila codice di terzi.
permissions: {}

# Una release per tag alla volta, e senza annullare quella in corso: una bozza
# con metà degli asset è peggio di nessuna bozza.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # La stessa di `verify.yml`, e per la stessa ragione: l'installer deve uscire
  # dal compilatore con cui le prove sono passate.
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.versione.outputs.tag }}

    steps:
      # Il tag calcolato **prima** di guardare qualunque file: su
      # `workflow_dispatch` `github.ref` è il ramo da cui si è lanciato, e un
      # checkout senza `ref` costruirebbe `main` sotto il nome del tag.
      #
      # # Perché il tag passa dall'ambiente e non da `${{ }}`
      #
      # Perché `${{ inputs.tag }}` scritto dentro un `run:` non è una variabile:
      # è una sostituzione di testo che avviene **prima** che bash veda la riga.
      # Un tag che contiene `$(…)` smette di essere un tag e diventa un comando.
      # Nell'ambiente il tag resta un dato, qualunque cosa ci sia scritto — e
      # la forma lo controlla la riga dopo, prima che vada da qualunque parte.
      - name: Quale tag
        id: scelto
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; else tag="$TAG_INPUT"; fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "«$tag» non ha la forma di un tag di versione (v1.2.3)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.scelto.outputs.tag }}
          persist-credentials: false

      # Il tag dice una versione, i tre file ne dicono un'altra: costruire lo
      # stesso è produrre un installer che si chiama in un modo e dichiara
      # l'altro. È il difetto che `strumenti/versione.js` esiste per impedire, e
      # questo è il punto in cui conta.
      - name: Il tag coincide con la versione
        id: versione
        shell: bash
        env:
          TAG: ${{ steps.scelto.outputs.tag }}
        run: |
          node strumenti/versione.js
          trovato=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$trovato" != "${TAG#v}" ]; then
            echo "il tag dice ${TAG#v}, i file dicono $trovato"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Le stesse prove di ogni push, sul tag e non sul ramo.
  verifica:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      ref: refs/tags/${{ needs.tag.outputs.tag }}

  costruisci:
    needs: [tag, verifica]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Rust
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal

      # **Senza cache**, né di cargo né di npm, ed è voluto: una cache è scritta
      # da corse precedenti — anche da quelle di un ramo qualunque — e quel che
      # finisce nell'installer deve venire dal lockfile e da nient'altro. Costa
      # dieci minuti a release; una cache avvelenata costerebbe la fiducia di
      # ogni copia installata.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Le dipendenze dell'interfaccia
        working-directory: apps/desktop
        run: npm ci

      # Gli avvisi sulle licenze si rigenerano **qui** e si confrontano: un
      # `THIRD-PARTY-NOTICES.md` vecchio di tre aggiornamenti di dipendenze è un
      # obbligo di attribuzione non rispettato. `verify` lo guarda già; qui si
      # guarda sul tag, che è quel che si spedisce.
      - name: Gli avvisi sulle licenze sono aggiornati
        shell: bash
        run: |
          node strumenti/licenze.js
          if ! git diff --quiet -- THIRD-PARTY-NOTICES.md; then
            echo "THIRD-PARTY-NOTICES.md non è aggiornato."
            echo "Rigenerarlo con: node strumenti/licenze.js"
            git --no-pager diff --stat -- THIRD-PARTY-NOTICES.md
            exit 1
          fi

      # Senza chiave: `createUpdaterArtifacts` spento solo per questa corsa,
      # perché altrimenti `tauri build` vorrebbe firmare e senza chiave si
      # fermerebbe. La firma la fa il lavoro dopo. `--locked` arriva a cargo:
      # l'installer contiene le dipendenze del lockfile, non quelle che cargo
      # sceglierebbe oggi.
      - name: Installer
        working-directory: apps/desktop
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      # ── la firma del codice andrebbe qui ─────────────────────────────────
      # Con un certificato in mano, il passo non è questo: si aggiunge
      # `bundle.windows.certificateThumbprint` (o `signCommand`) in
      # `tauri.conf.json`, e `tauri build` firma da sé sia l'eseguibile sia
      # l'installer. Un passo di firma qui, dopo il bundle, firmerebbe
      # l'installer e non il binario dentro.

      - name: Raccogli quel che è uscito
        shell: bash
        run: |
          mkdir -p uscita
          n=$(ls target/release/bundle/nsis/*-setup.exe | wc -l)
          if [ "$n" != "1" ]; then
            echo "attesi un installer, trovati $n"
            exit 1
          fi
          cp target/release/bundle/nsis/*-setup.exe uscita/
          cp LICENSE THIRD-PARTY-NOTICES.md PRIVACY.md TERMS.md uscita/
          ls -la uscita

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rymembra-non-firmato
          path: uscita/
          if-no-files-found: error

  firma:
    needs: [tag, costruisci]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # Il tag per gli strumenti (`firma.js`, `manifesto.js`), il lockfile per la
      # CLI, `tauri.conf.json` per la chiave pubblica. Nessuna compilazione.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      # `--ignore-scripts`: le versioni e gli hash li dice il lockfile, e nessun
      # pacchetto esegue niente all'installazione su questa macchina. La CLI di
      # Tauri non ne ha bisogno: il binario della piattaforma arriva come
      # dipendenza facoltativa, non da uno script.
      - name: La CLI di Tauri, dal lockfile
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rymembra-non-firmato
          path: uscita/

      # Prima di firmare, e non dopo. Alla v2.0.1 il segreto era arrivato
      # spezzato, e la corsa è morta dopo tredici minuti dicendo «Missing
      # comment in secret key» — un guasto da incollatura. Qui costa un secondo.
      #
      # Non guarda che la password sia giusta né che la chiave sia *quella*: la
      # prima si saprebbe solo aprendo la chiave, la seconda solo dopo aver
      # firmato, ed è il mestiere di `manifesto.js` più sotto.
      - name: La chiave di firma è quella che sembra
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node strumenti/firma.js

      # Il `.sig` accanto all'installer, nella forma che l'updater legge: è lo
      # stesso file che `createUpdaterArtifacts` scriveva da sé.
      #
      # `--app-version` non è facoltativo: `tauri build` lo metteva da solo, a
      # mano va detto. Scrive la versione nel commento fidato della firma, che
      # la firma copre; dalla 3.0 Rymembra accende `requireSignedVersion` e
      # **rifiuta** un aggiornamento la cui firma non dica la versione che il
      # manifesto annuncia — è quel che impedisce a chi manomette `latest.json`
      # di accoppiare un numero nuovo all'installer vecchio di una release
      # bucata. Una firma senza versione, da qui in avanti, non aggiorna più
      # nessuna copia 3.x.
      - name: Firma per l'updater
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          for f in ../../uscita/*-setup.exe; do
            npx tauri signer sign --app-version "${TAG#v}" "$f"
          done
          ls -la ../../uscita

      # Dopo la firma e **prima** della pubblicazione: qui dentro c'è il
      # confronto fra l'identificativo della chiave che ha firmato e quello
      # della chiave che gli eseguibili già installati conoscono. È l'unico
      # posto in tutta la catena in cui quel disallineamento si può ancora
      # scoprire senza che lo racconti un utente. Si ferma anche se le note
      # dell'aggiornamento sarebbero vuote.
      - name: Il manifesto dell'updater
        shell: bash
        run: |
          mkdir -p target/release/bundle/nsis
          cp uscita/*-setup.exe uscita/*-setup.exe.sig target/release/bundle/nsis/
          node strumenti/manifesto.js uscita

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rymembra-windows
          path: uscita/
          if-no-files-found: error

  pubblica:
    needs: [tag, firma]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # L'unico lavoro che scrive sul repository, e non esegue codice del
    # repository: scarica i file firmati e apre la bozza.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rymembra-windows
          path: uscita/

      - name: Pubblica la release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: uscita/*
          draft: true
          fail_on_unmatched_files: true
          # Il tag calcolato sopra e non `github.ref`: su `workflow_dispatch` il
          # ref è il ramo, e la release si chiamerebbe «main».
          tag_name: ${{ needs.tag.outputs.tag }}
          body: |
            ## Rymembra ${{ needs.tag.outputs.tag }}

            See `CHANGELOG.md` for what changed.

            ### Before installing

            **This installer is not signed.** Windows SmartScreen will show a
            warning: «Windows protected your PC». To proceed: *More info* →
            *Run anyway*.

            It isn't a formality and shouldn't be taken for granted. An
            unsigned installer is an installer whose provenance you cannot
            verify, and the only thing I can offer in exchange is that the
            source is here and builds itself. An OV certificate requires
            identity validation and an annual cost: when there is one, this
            warning will disappear from these notes.

            ### Coming from the previous version

            This installer removes the previous version by itself and leaves
            its data alone. The first time Rymembra starts, the library,
            settings, skins, drafts, accounts and sync of the previous version
            carry over automatically. If the previous version is open, close
            it first (also from the icon next to the clock): the installer
            waits a few seconds, then leaves it installed rather than closing
            it under you.

            ### Where the music comes from

            Rymembra plays your files, and looks for what's missing in the
            **free catalogs**. It doesn't download from YouTube and doesn't
            scrape Spotify: the why is in `README.md`. What no free catalog
            has ends up in a shopping list, not in an error.

            ### Licenses

            `LICENSE` (MIT), `THIRD-PARTY-NOTICES.md` (the dependencies, with
            their texts), `PRIVACY.md` (every network request the program can
            make), `TERMS.md` (what you can do with the music you download —
            including the Live Music Archive's **non-commercial**
            constraint).

      # ── e adesso la bozza va guardata ────────────────────────────────────
      # Restano due gesti a mano, e sono entrambi voluti:
      #
      #   1. scaricare l'installer dalla bozza e provarlo su una macchina vera.
      #      Le prove dicono che il codice fa quel che deve; non dicono che
      #      l'installer parta;
      #   2. pubblicare la bozza. Da quel momento `/releases/latest` la vede, e
      #      ogni copia di Rymembra accesa nel mondo se ne accorge al prossimo
      #      avvio.
      #
      # Automatizzare il secondo si può in due righe. Non si fa: è l'unico punto
      # della catena in cui una persona guarda la cosa prima che parta.
