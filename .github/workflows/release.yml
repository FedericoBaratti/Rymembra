# Da un tag a un installer per Windows e a un APK per i telefoni, scaricabili.
#
# # Cosa non fa ancora, e perché è scritto qui e non altrove
#
# **Non firma il codice per Windows.** Il blocco `bundle.windows.signCommand`
# in `tauri.conf.json` non c'è, perché un certificato OV richiede la
# validazione dell'identità di chi lo chiede — settimane, e un costo annuo.
# Finché non c'è, **SmartScreen mostra un avviso a chiunque scarichi**, ed è il
# singolo motivo per cui la maggior parte delle applicazioni indipendenti non
# viene installata. La release lo dice nel proprio corpo invece di lasciarlo
# scoprire. L'APK invece è firmato (vedi `firma-apk`): Android non installa
# niente che non lo sia.
#
# # L'updater, e la cosa da sapere prima di premere «pubblica»
#
# La release nasce **bozza**, e questo interagisce con l'updater in un modo che
# conviene aver capito: `plugins.updater.endpoints` punta a
# `/releases/latest/download/latest.json`, e `/releases/latest` **salta le
# bozze**. Lo stesso vale per i telefoni, che chiedono `/releases/latest`
# all'API di GitHub (`rilasci.rs`). Finché la release resta bozza, quindi,
# nessuna copia installata di Rymembra la vede: si può scaricare l'installer o
# l'APK a mano dalla pagina, provarlo, e accorgersi che qualcosa non va senza
# che nel frattempo si sia aggiornato nessuno.
#
# Pubblicare la bozza **è** il gesto che spedisce l'aggiornamento a tutti, ai
# computer e ai telefoni insieme. Non è un effetto collaterale da correggere: è
# l'unico momento in cui una persona guarda la cosa prima che parta, ed è messo
# lì apposta.
#
# Una release senza APK è ammessa (decisione D-6): i telefoni non la vedono e
# aspettano la prossima che lo porti. Questo workflow però lo costruisce sempre:
# se la build del telefono si rompe, si ferma anche quella del computer, e una
# release solo per Windows è una scelta da fare a mano, non un guasto che passa.
#
# # Perché le azioni sono inchiodate a un hash e non a un'etichetta
#
# Perché `actions/checkout@v4` non nomina una versione: nomina un'**etichetta**,
# e chi possiede quel repository può spostarla su un altro commit senza che qui
# cambi una riga. Non è un timore di scuola: nel marzo del 2025 le etichette di
# `tj-actions/changed-files` sono state riscritte, e ventitremila repository
# hanno eseguito codice nuovo credendo di eseguire quello di prima.
#
# Il prezzo è che le azioni non si aggiornano più da sole. Si aggiornano a mano,
# leggendo la versione dal commento accanto all'hash.
#
# # I lavori, e perché le chiavi ne vedono tre soli
#
#   tag → segreti → verifica ┬→ costruisci → firma ─────┬→ pubblica
#                            └→ apk ───────→ firma-apk ─┘
#
# `segreti` è il primo dopo `tag`, e il solo che guarda i segreti **prima** di
# ogni compilazione: se l'ambiente `release` non c'è (GitHub lo crea vuoto, senza
# segreti e senza revisore) o un segreto manca, è incollato male, o il keystore
# non si apre con quella password e quell'alias, o è di un'altra chiave, lo
# dice dopo due minuti. Prima lo dicevano `firma` e `firma-apk`, dopo ore di
# compilazione. Riusa i controlli di `strumenti/firma.js` e di
# `strumenti/apk.js`, gli stessi che poi firmano, e non esegue codice di terzi:
# niente `npm ci`, niente compilazioni.
#
# Le chiavi stanno nei segreti dell'**ambiente `release`**:
#
#   - `TAURI_SIGNING_PRIVATE_KEY` e `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`, la
#     chiave minisign dell'updater: firma l'installer (`firma`) e, con la
#     stessa chiave, l'APK per la verifica dentro l'app (`firma-apk`);
#   - `ANDROID_KEYSTORE_BASE64` (il `.jks` in base64), `ANDROID_KEYSTORE_PASSWORD`
#     e `ANDROID_KEY_ALIAS`, la chiave con cui Android riconosce gli
#     aggiornamenti dell'app (`firma-apk`).
#
# Non in quelli del repository: quelli li legge ogni workflow di ogni ramo,
# anche uno aggiunto apposta per stamparli da chiunque possa fare push (o da un
# token rubato con lo scope `workflow`). Nessuna delle due chiavi è
# recuperabile o sostituibile: gli eseguibili già installati si fidano solo
# della minisign, e un telefono accetta un aggiornamento solo dallo stesso
# certificato dell'app che ha (l'impronta è in
# `strumenti/android-certificato.sha256`, e `firma-apk` la confronta). Perderne
# una vuol dire che nessuna copia di quel tipo si aggiornerà mai più — andrebbero
# tutte reinstallate a mano. Una copia di tutte e due fuori da questo computer
# e fuori da GitHub.
#
# # L'ambiente `release`, prima che funzioni
#
# In *Settings → Environments → release*: «Deployment branches and tags» su
# *Selected*, con la sola regola di **tag** `v*`; un revisore obbligatorio; i
# cinque segreti lì, e **tolti** da *Settings → Secrets → Actions → Repository
# secrets* (finché ci sono anche lì, l'ambiente non protegge niente). I lavori
# `segreti`, `firma` e `firma-apk` si fermano ad aspettare l'approvazione: è
# voluto, è un gesto umano prima che le chiavi escano dal loro cassetto. Sono
# **tre approvazioni**: la prima subito dopo il tag (`segreti`, due minuti di
# lavoro, e solo dopo parte la verifica), le altre due a compilazione finita —
# se `firma` e `firma-apk` aspettano insieme si approvano con un gesto solo,
# altrimenti uno alla volta. Una corsa lanciata a mano va lanciata **dal
# tag** («Use workflow from» → *Tags*), non da un ramo: un ramo l'ambiente lo
# rifiuta, e il lavoro `tag` lo dice subito invece che dopo un'ora di
# compilazione.
#
# Fino alla 2.4 la chiave stava nell'ambiente di `tauri build`: cioè accanto
# agli script di compilazione di quattrocento crate e ai pacchetti npm, ognuno
# dei quali esegue codice suo. Adesso `costruisci` e `apk` producono installer
# e APK **senza** chiave e li consegnano come artefatti; `firma` e `firma-apk`
# girano su macchine pulite, installano solo la CLI di Tauri dal lockfile senza
# eseguirne gli script (e gli strumenti dell'SDK di Android), e firmano; e
# `segreti` gira su una macchina ancora più pulita, che non installa niente.
# Sulle macchine che hanno compilato le chiavi non arrivano mai: per questo
# l'APK non lo firma Gradle con `keystore.properties`, ma `apksigner` dopo.
#
# Lo stesso per il permesso di scrivere sul repository: lo ha solo `pubblica`,
# che non esegue codice del repository. Tutti gli altri leggono e basta.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Il tag da rilasciare, per esempio v3.0.0: lo stesso scelto in «Use workflow from» → Tags"
        required: true

# Niente per nessuno, e ogni lavoro chiede il suo: un `contents: write` in cima
# lo darebbe anche al lavoro che compila codice di terzi.
permissions: {}

# Una release per tag alla volta, e senza annullare quella in corso: una bozza
# con metà degli asset è peggio di nessuna bozza.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # La stessa di `verify.yml`, e per la stessa ragione: l'installer deve uscire
  # dal compilatore con cui le prove sono passate.
  RUSTUP_TOOLCHAIN: "1.97.1"
  # Gli strumenti dell'SDK di Android che leggono e firmano l'APK (`zipalign`,
  # `aapt2`, `apksigner`), la stessa versione nei due lavori che li usano.
  BUILD_TOOLS_VERSIONE: "36.1.0"

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.versione.outputs.tag }}

    steps:
      # Il tag guardato **prima** di qualunque file. A mano (`workflow_dispatch`)
      # la corsa deve partire dal tag stesso, e il campo `tag` deve dire lo
      # stesso tag: da un ramo il lavoro `firma` verrebbe rifiutato
      # dall'ambiente `release`, che accetta solo i tag `v*`, ma dopo un'ora di
      # compilazione; e un workflow preso da un ramo è un workflow che chiunque
      # possa fare push ha potuto riscrivere. Prima dell'ambiente si lanciava
      # da `main` col tag nel campo, ed è il motivo per cui il checkout qui
      # sotto nomina il tag invece di fidarsi di `github.ref`.
      #
      # # Perché il tag passa dall'ambiente e non da `${{ }}`
      #
      # Perché `${{ inputs.tag }}` scritto dentro un `run:` non è una variabile:
      # è una sostituzione di testo che avviene **prima** che bash veda la riga.
      # Un tag che contiene `$(…)` smette di essere un tag e diventa un comando.
      # Nell'ambiente il tag resta un dato, qualunque cosa ci sia scritto — e
      # la forma lo controlla la riga dopo, prima che vada da qualunque parte.
      - name: Quale tag
        id: scelto
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Lanciata dal ramo «$REF_NAME»: va lanciata dal tag («Use workflow from» → Tags → il tag da rilasciare). L'ambiente «release» accetta solo i tag v*."
            exit 1
          fi
          tag="$REF_NAME"
          # Tre numeri e niente suffissi: `versione.js` non ne ammette (NSIS,
          # l'MSIX e il versionCode dell'APK non saprebbero cosa farne), e il
          # confronto qui sotto lo rifiuterebbe comunque.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "«$tag» non ha la forma di un tag di versione (v1.2.3)"
            exit 1
          fi
          # Il campo non si stampa: è testo libero, e il tag è già a schermo.
          if [ -n "$TAG_INPUT" ] && [ "$TAG_INPUT" != "$tag" ]; then
            echo "::error::Lanciata dal tag $tag, ma il campo «tag» ne dice un altro: devono coincidere."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.scelto.outputs.tag }}
          persist-credentials: false

      # Il tag dice una versione, i file ne dicono un'altra: costruire lo
      # stesso è produrre un installer che si chiama in un modo e dichiara
      # l'altro. È il difetto che `strumenti/versione.js` esiste per impedire, e
      # questo è il punto in cui conta.
      - name: Il tag coincide con la versione
        id: versione
        shell: bash
        env:
          TAG: ${{ steps.scelto.outputs.tag }}
        run: |
          node strumenti/versione.js
          # La finestra «Novità» di questa versione. Una minor o una major (la
          # patch è zero: 3.3.0, 4.0.0) **deve** averla: senza, chi viene dalla
          # versione prima non la vedrà mai, e la correttiva dopo non la
          # recupera. Una correttiva (3.3.1) non ne ha, ed è solo un avviso.
          node strumenti/novita.js --se-minor
          trovato=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$trovato" != "${TAG#v}" ]; then
            echo "il tag dice ${TAG#v}, i file dicono $trovato"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Il corpo della bozza: per chi ha una build di prova del telefono, per
      # Windows, per Android. Da uno script e non scritto qui: nomina file,
      # versione e impronta del certificato, e i menù dell'app come li dice
      # `en.json` (vedi `strumenti/corpo.js`). Qui, e non in `pubblica`, che non
      # esegue codice del repository.
      - name: Il corpo della release
        run: node strumenti/corpo.js corpo/corpo.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rymembra-corpo
          path: corpo/
          if-no-files-found: error

  # I cinque segreti dell'ambiente `release`, guardati **prima** di qualunque
  # compilazione (S10-3). Se l'ambiente non esiste, GitHub lo crea al volo,
  # vuoto e senza revisore: `costruisci` e `apk` girerebbero per un'ora e mezza,
  # e `firma` morirebbe alla prima riga. Qui lo si vede dopo due minuti, nello
  # stesso ambiente che poi consegnerà le chiavi, quindi con le stesse regole
  # (solo un tag `v*`, un revisore): è la prima delle tre approvazioni.
  #
  # Gli stessi controlli di chi poi firma, non una copia:
  #
  #   - `strumenti/firma.js`: la chiave minisign è intera, base64 pulita, senza
  #     spazi ai bordi, e la password pure. Rifiuta anche un a capo in fondo,
  #     e va bene così: la CLI di Tauri non fa `trim()` e lo rifiuterebbe lo
  #     stesso, dopo la compilazione; qui il rifiuto costa due minuti.
  #   - `strumenti/apk.js segreti`: ci sono i tre segreti di Android, il
  #     keystore è base64 di un keystore, `keytool` lo apre con quella password
  #     e quell'alias, e il certificato ha l'impronta di
  #     `strumenti/android-certificato.sha256`. Non guarda la password della
  #     minisign (la sapremo solo firmando) né il valore di niente: non stampa
  #     mai un segreto, e il keystore sta su disco il tempo di `keytool`.
  #
  # Non esegue codice di terzi: niente `npm ci`, niente compilazioni. Gli
  # strumenti sono script di Node che usano solo la libreria di serie.
  segreti:
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: La chiave dell'updater è quella che sembra
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node strumenti/firma.js

      # `keytool` è quello del JDK 17 dell'immagine, lo stesso che usano
      # `apksigner` e Gradle negli altri lavori.
      - name: La chiave di Android apre il keystore, ed è quella dei rilasci
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          node strumenti/apk.js segreti

  # Le stesse prove di ogni push, sul tag e non sul ramo. Con una differenza:
  # gli avvisi di sicurezza sulle dipendenze non fermano la release, vanno in
  # testa alla bozza (decisione D-96; vedi il lavoro `dipendenze` di
  # `verify.yml`). Licenze e divieti fermano come sempre. Dopo `segreti`: una
  # configurazione sbagliata si scopre prima di un'ora di prove.
  verifica:
    needs: [tag, segreti]
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      ref: refs/tags/${{ needs.tag.outputs.tag }}
      consultivo: true

  costruisci:
    needs: [tag, segreti, verifica]
    runs-on: windows-latest
    # Novanta: senza cache (qui sotto) tutte le dipendenze si compilano in
    # release con `codegen-units = 1` e LTO thin su quattro processori; i
    # sessanta erano misurati sulla 3.2.0, con 707 pacchetti invece di 844. Un
    # timeout a cinquantotto minuti vuol dire ricominciare da zero.
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Rust
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal

      # **Senza cache**, né di cargo né di npm, ed è voluto: una cache è scritta
      # da corse precedenti — anche da quelle di un ramo qualunque — e quel che
      # finisce nell'installer deve venire dal lockfile e da nient'altro. Costa
      # dieci minuti a release; una cache avvelenata costerebbe la fiducia di
      # ogni copia installata.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Le dipendenze dell'interfaccia
        working-directory: apps/desktop
        run: npm ci

      # Gli avvisi sulle licenze si rigenerano **qui** e si confrontano: un
      # `THIRD-PARTY-NOTICES.md` vecchio di tre aggiornamenti di dipendenze è un
      # obbligo di attribuzione non rispettato. `verify` lo guarda già; qui si
      # guarda sul tag, che è quel che si spedisce.
      - name: Gli avvisi sulle licenze sono aggiornati
        shell: bash
        run: |
          node strumenti/licenze.js
          if ! git diff --quiet -- THIRD-PARTY-NOTICES.md; then
            echo "THIRD-PARTY-NOTICES.md non è aggiornato."
            echo "Rigenerarlo con: node strumenti/licenze.js"
            git --no-pager diff --stat -- THIRD-PARTY-NOTICES.md
            exit 1
          fi

      # Senza chiave: `createUpdaterArtifacts` spento solo per questa corsa,
      # perché altrimenti `tauri build` vorrebbe firmare e senza chiave si
      # fermerebbe. La firma la fa il lavoro dopo. `--locked` arriva a cargo:
      # l'installer contiene le dipendenze del lockfile, non quelle che cargo
      # sceglierebbe oggi.
      - name: Installer
        working-directory: apps/desktop
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      # ── la firma del codice andrebbe qui ─────────────────────────────────
      # Con un certificato in mano, il passo non è questo: si aggiunge
      # `bundle.windows.certificateThumbprint` (o `signCommand`) in
      # `tauri.conf.json`, e `tauri build` firma da sé sia l'eseguibile sia
      # l'installer. Un passo di firma qui, dopo il bundle, firmerebbe
      # l'installer e non il binario dentro.

      - name: Raccogli quel che è uscito
        shell: bash
        run: |
          mkdir -p uscita
          n=$(ls target/release/bundle/nsis/*-setup.exe | wc -l)
          if [ "$n" != "1" ]; then
            echo "attesi un installer, trovati $n"
            exit 1
          fi
          cp target/release/bundle/nsis/*-setup.exe uscita/
          cp LICENSE THIRD-PARTY-NOTICES.md PRIVACY.md TERMS.md uscita/
          ls -la uscita

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rymembra-non-firmato
          path: uscita/
          if-no-files-found: error

  firma:
    needs: [tag, costruisci]
    runs-on: windows-latest
    timeout-minutes: 15
    # Uno dei due lavori che vedono le chiavi, ed è per questo che nomina
    # l'ambiente: i segreti stanno lì e non fra quelli del repository, e
    # l'ambiente li consegna solo a una corsa partita da un tag `v*` che una
    # persona ha approvato. Come si configura: nel preambolo.
    environment: release
    permissions:
      contents: read

    steps:
      # Il tag per gli strumenti (`firma.js`, `manifesto.js`), il lockfile per la
      # CLI, `tauri.conf.json` per la chiave pubblica. Nessuna compilazione.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      # `--ignore-scripts`: le versioni e gli hash li dice il lockfile, e nessun
      # pacchetto esegue niente all'installazione su questa macchina. La CLI di
      # Tauri non ne ha bisogno: il binario della piattaforma arriva come
      # dipendenza facoltativa, non da uno script.
      - name: La CLI di Tauri, dal lockfile
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rymembra-non-firmato
          path: uscita/

      # Prima di firmare, e non dopo. Alla v2.0.1 il segreto era arrivato
      # spezzato, e la corsa è morta dopo tredici minuti dicendo «Missing
      # comment in secret key» — un guasto da incollatura. Qui costa un secondo.
      #
      # Non guarda che la password sia giusta né che la chiave sia *quella*: la
      # prima si saprebbe solo aprendo la chiave, la seconda solo dopo aver
      # firmato, ed è il mestiere di `manifesto.js` più sotto.
      - name: La chiave di firma è quella che sembra
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node strumenti/firma.js

      # Il `.sig` accanto all'installer, nella forma che l'updater legge: è lo
      # stesso file che `createUpdaterArtifacts` scriveva da sé.
      #
      # `--app-version` non è facoltativo: `tauri build` lo metteva da solo, a
      # mano va detto. Scrive la versione nel commento fidato della firma, che
      # la firma copre; dalla 3.0 Rymembra accende `requireSignedVersion` e
      # **rifiuta** un aggiornamento la cui firma non dica la versione che il
      # manifesto annuncia — è quel che impedisce a chi manomette `latest.json`
      # di accoppiare un numero nuovo all'installer vecchio di una release
      # bucata. Una firma senza versione, da qui in avanti, non aggiorna più
      # nessuna copia 3.x.
      - name: Firma per l'updater
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          for f in ../../uscita/*-setup.exe; do
            npx tauri signer sign --app-version "${TAG#v}" "$f"
          done
          ls -la ../../uscita

      # Dopo la firma e **prima** della pubblicazione: qui dentro c'è il
      # confronto fra l'identificativo della chiave che ha firmato e quello
      # della chiave che gli eseguibili già installati conoscono. È l'unico
      # posto in tutta la catena in cui quel disallineamento si può ancora
      # scoprire senza che lo racconti un utente. Si ferma anche se le note
      # dell'aggiornamento sarebbero vuote.
      #
      # E la firma si verifica **contro i byte**, non solo nell'id e nella
      # versione (`strumenti/minisign.js`, BLAKE2b-512 e Ed25519 come il
      # client): sull'installer firmato, su quello che si carica in `uscita/`
      # e, riletta da disco, sulla firma dentro `latest.json`. Un `.sig` che non
      # è di questo file passerebbe tutti gli altri cancelli, e ogni copia
      # installata scaricherebbe l'installer per buttarlo.
      - name: Il manifesto dell'updater
        shell: bash
        run: |
          mkdir -p target/release/bundle/nsis
          cp uscita/*-setup.exe uscita/*-setup.exe.sig target/release/bundle/nsis/
          node strumenti/manifesto.js uscita

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rymembra-windows
          path: uscita/
          if-no-files-found: error

  # Il telefono, costruito senza chiave come l'installer. Solo arm64: i
  # telefoni a 64 bit, cioè quasi tutti (decisione D-6); l'x86_64 serviva solo
  # a emulatori e Chromebook e raddoppiava il tempo.
  apk:
    needs: [tag, segreti, verifica]
    # `ubuntu-24.04` e non `-latest`: l'immagine non cambia sotto i piedi da un
    # tag all'altro.
    runs-on: ubuntu-24.04
    # Novanta, come `costruisci`, e per le stesse ragioni: senza cache, la
    # `.so` di rilascio con LTO thin e `codegen-units = 1`.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # L'NDK **inchiodato**, e non quello di serie dell'immagine: lì
      # `ANDROID_NDK_HOME` è il 27, che compila le `.so` allineate a 4 KB senza
      # nessun errore — su un telefono con pagine da 16 KB l'app girerebbe in
      # «compatibilità», con un avviso al primo avvio. Dal 28 in poi il 16 KB è
      # di serie; il 30 è quello con cui l'APK è stato provato. Si alza a mano.
      NDK_VERSIONE: "30.0.16248370"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
          rustup target add aarch64-linux-android --toolchain ${{ env.RUSTUP_TOOLCHAIN }}

      # Senza cache, come `costruisci`: quel che finisce nell'APK deve venire
      # dal lockfile e da nient'altro.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      # Installati con `sdkmanager` nella versione scritta qui, e controllati:
      # se l'immagine ne ha già uno uguale l'installazione non fa niente. Tutte
      # le variabili che un pezzo della catena può leggere puntano al 30 —
      # `NDK_HOME` la CLI di Tauri, `ANDROID_NDK_HOME`/`ANDROID_NDK_ROOT` il
      # resto — così nessuno torna da solo al 27. Il compilatore C dell'NDK
      # serve a SQLite e a `ring`; il linker alla `.so`. L'API 26 è
      # `minSdkVersion` (`tauri.android.conf.json`).
      - name: L'NDK e gli strumenti di Android, inchiodati
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Non `yes | …`: con `pipefail`, di serie per `bash` nelle azioni, il
          # SIGPIPE di `yes` quando sdkmanager ha finito farebbe fallire il passo.
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" --install "ndk;$NDK_VERSIONE" "build-tools;$BUILD_TOOLS_VERSIONE"
          ndk="$ANDROID_HOME/ndk/$NDK_VERSIONE"
          if ! grep -qx "Pkg.Revision = $NDK_VERSIONE" "$ndk/source.properties"; then
            echo "::error::In $ndk non c'è l'NDK $NDK_VERSIONE."
            exit 1
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "NDK_HOME=$ndk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "JAVA_HOME=$JAVA_HOME_17_X64"
            echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSIONE"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      # Con `keystore.properties` Gradle firmerebbe qui, sulla macchina che ha
      # appena eseguito gli script di compilazione di centinaia di crate e
      # pacchetti npm. Non c'è (è nei `.gitignore`), e se un giorno ci fosse
      # la corsa si ferma.
      - name: Nessuna chiave sulla macchina che compila
        shell: bash
        run: |
          if [ -e apps/desktop/src-tauri/gen/android/keystore.properties ]; then
            echo "::error::gen/android/keystore.properties c'è: l'APK si firma in firma-apk, non qui."
            exit 1
          fi

      # La release, senza chiave: Gradle produce `app-arm64-release-unsigned.apk`
      # con R8 acceso. `--split-per-abi` per un APK della sola ABI arm64,
      # invece dell'universale che ne porterebbe due.
      - name: L'APK
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri android build --apk --split-per-abi --target aarch64 --ci

      # La CLI di Tauri non passa `--locked` a cargo, che gira dentro Gradle:
      # se il lockfile fosse cambiato, l'APK conterrebbe dipendenze diverse da
      # quelle provate. `verifica` lo impedisce già (clippy `--locked` sul
      # bersaglio del telefono); qui lo si guarda sull'albero che ha compilato.
      - name: Il lockfile non è cambiato
        run: git diff --exit-code -- Cargo.lock apps/desktop/package-lock.json

      # Prima della firma, senza chiave: pagine da 16 KB, solo arm64, il
      # manifesto (pacchetto, versione, versionCode, niente debug), le sei
      # icone `drawable/auto_*` di Android Auto ancora nelle risorse
      # (`aapt2 dump resources`: la riduzione delle risorse le toglieva, R11-5)
      # e R8, che deve aver lasciato `Ponte.chiama` e gli altri nomi che Rust
      # chiama per nome (`strumenti/apk.js`). Il nome è quello che l'app cerca
      # (`rilasci.rs::apk_per`).
      - name: L'APK, controllato
        shell: bash
        run: |
          uscite=apps/desktop/src-tauri/gen/android/app/build/outputs
          n=$(ls "$uscite"/apk/arm64/release/*.apk 2>/dev/null | wc -l)
          if [ "$n" != "1" ]; then
            echo "atteso un APK arm64 di rilascio, trovati $n"
            ls -R "$uscite/apk"
            exit 1
          fi
          nome=$(node strumenti/apk.js nome)
          mkdir -p uscita-apk mapping-r8
          cp "$uscite"/apk/arm64/release/*.apk "uscita-apk/$nome"
          cp "$uscite/mapping/arm64Release/mapping.txt" mapping-r8/
          node strumenti/apk.js controlla "uscita-apk/$nome" --mapping mapping-r8/mapping.txt
          ls -la uscita-apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rymembra-android-non-firmato
          path: uscita-apk/
          if-no-files-found: error

      # Il `mapping.txt` di R8, per leggere le tracce dei diari del telefono
      # (i nomi accorciati tornano quelli veri). Un artefatto della corsa, con
      # la conservazione più lunga, e **non** un asset della release.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rymembra-android-mapping
          path: mapping-r8/
          if-no-files-found: error
          retention-days: 90

  firma-apk:
    needs: [tag, apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # L'altro lavoro che vede le chiavi: quella di Android e la minisign.
    # Nessuna compilazione: la CLI di Tauri dal lockfile senza script, e
    # `apksigner` dall'SDK.
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: La CLI di Tauri, dal lockfile
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Gli strumenti di Android
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Non `yes | …`: con `pipefail`, di serie per `bash` nelle azioni, il
          # SIGPIPE di `yes` quando sdkmanager ha finito farebbe fallire il passo.
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSIONE"
          {
            echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSIONE"
            echo "JAVA_HOME=$JAVA_HOME_17_X64"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rymembra-android-non-firmato
          path: non-firmato/

      - name: La chiave dell'updater è quella che sembra
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node strumenti/firma.js

      # La firma di Android, con `apksigner`. I segreti arrivano dall'ambiente
      # del passo e mai dentro la riga di comando: le password con `env:`
      # (`apksigner` le legge da lì, e non finiscono in `ps` né nel registro),
      # il keystore in un file di `$RUNNER_TEMP` leggibile solo da chi lo
      # scrive (`umask 077`), che il passo dopo cancella comunque vada. Niente
      # `set -x`. Il keystore è PKCS12, con una password sola per il
      # contenitore e la chiave. Solo v2 e v3 (`minSdk` 26): il v4 scriverebbe
      # un `.idsig` accanto all'APK, che non serve a nessuno.
      - name: Firma dell'APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Il segreto $v manca fra quelli dell'ambiente release (Settings → Environments → release)."
              exit 1
            fi
          done
          umask 077
          ks="$RUNNER_TEMP/rilascio.jks"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks" 2> /dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 non è base64: va il file .jks codificato, per intero."
            exit 1
          fi
          mkdir -p uscita
          for f in non-firmato/*.apk; do
            "$ANDROID_BUILD_TOOLS/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
              --v4-signing-enabled false --out "uscita/$(basename "$f")" "$f"
          done
          ls -la uscita

      - name: La chiave di Android non resta su disco
        if: always()
        run: rm -f "$RUNNER_TEMP/rilascio.jks"

      # La firma minisign dell'APK, con la chiave dell'updater: `….apk.sig`
      # accanto all'APK, come il `.sig` dell'installer, con la versione nel
      # commento fidato. È quello che l'app sul telefono verifica prima di
      # passare l'APK all'installatore di Android (decisione D-6), come fa il
      # computer con l'installer. Il nome non finisce in `.apk`: l'app non lo
      # scambia per l'APK.
      - name: Firma dell'APK per l'app
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          for f in ../../uscita/*.apk; do
            npx tauri signer sign --app-version "${TAG#v}" "$f"
          done

      # Sul file firmato, cioè quello che la gente scarica: allineamento (che
      # `apksigner` può aver cambiato), un firmatario solo, non la chiave di
      # debug, l'impronta del certificato uguale a quella inchiodata in
      # `strumenti/android-certificato.sha256`, e il `.apk.sig` della chiave
      # dell'updater per questa versione, **valido per i byte dell'APK**
      # (`strumenti/minisign.js`: è quel che l'app sul telefono verifica prima
      # di consegnarlo ad Android). È il gemello di `manifesto.js`: una chiave
      # sbagliata, o un `.apk.sig` di un altro file, vuol dire che nessun
      # telefono si aggiornerà, e lo scoprirebbe solo chi prova.
      - name: L'APK firmato, controllato
        shell: bash
        run: |
          for f in uscita/*.apk; do
            node strumenti/apk.js verifica "$f"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rymembra-android
          path: uscita/
          if-no-files-found: error

  pubblica:
    needs: [tag, verifica, firma, firma-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # L'unico lavoro che scrive sul repository, e non esegue codice del
    # repository: scarica i file firmati e apre la bozza.
    permissions:
      contents: write

    steps:
      # Le due metà nella stessa cartella e nella stessa bozza: il gesto
      # «pubblica» spedisce insieme a computer e telefoni.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rymembra-windows
          path: uscita/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rymembra-android
          path: uscita/

      # Il corpo in una cartella sua: `uscita/*` sono gli asset.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rymembra-corpo
          path: corpo/

      # Una release già **pubblicata** non si ricarica. Su una release che
      # esiste `action-gh-release` la lascia com'è, cioè pubblicata, e gli asset
      # omonimi li cancella e li ricarica: un «Re-run failed jobs», o un lancio a
      # mano sul tag di una release già uscita, spedirebbe a ogni copia
      # installata un installer appena ricostruito (la build non è
      # riproducibile: è un altro file), senza bozza e senza il gesto umano del
      # preambolo; e fra la cancellazione e il nuovo caricamento `latest.json`
      # mancherebbe. Il controllo sta qui e non nel lavoro `tag`, perché «Re-run
      # failed jobs» i lavori riusciti non li ripete, e questo è il lavoro che
      # scrive. Una bozza invece si ricarica: è il modo di ripararla.
      #
      # `releases/tags/…` risponde 404 se il tag non ha una release pubblicata;
      # il campo `draft` si guarda lo stesso, per non dipendere da come tratta
      # le bozze. Qualunque altra risposta ferma la corsa: nel dubbio non si
      # carica niente. Il token arriva a curl dall'ingresso e non dalla riga di
      # comando.
      - name: La release del tag non è già uscita
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          risposta="$RUNNER_TEMP/release-esistente.json"
          codice=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -sS \
            -o "$risposta" -w '%{http_code}' -H @- \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          case "$codice" in
            404)
              echo "Il tag $TAG non ha una release pubblicata: si apre o si aggiorna la bozza."
              ;;
            200)
              if [ "$(jq -r '.draft' "$risposta")" = "true" ]; then
                echo "La release di $TAG è ancora una bozza: si aggiorna."
              else
                echo "::error::La release $TAG è già pubblicata: ricaricarne gli asset li spedirebbe subito a ogni copia installata, senza passare dalla bozza. Una correzione esce con un tag nuovo."
                exit 1
              fi
              ;;
            *)
              echo "::error::GitHub ha risposto $codice alla domanda sulla release $TAG: non si sa se sia già pubblicata, e nel dubbio non si carica niente."
              exit 1
              ;;
          esac

      # Gli avvisi di sicurezza delle dipendenze trovati da `verifica` non
      # hanno fermato la corsa (D-96): si dicono in testa alla bozza, a chi la
      # pubblica, con il collegamento alla corsa. È una nota da leggere e
      # togliere prima di pubblicare, non una frase per chi scarica.
      - name: Gli avvisi sulle dipendenze, in testa alla bozza
        if: needs.verifica.outputs.avvisi == 'trovati'
        shell: bash
        env:
          CORSA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '> **Before publishing — delete this note.** The dependency check of this run found security advisories (`cargo deny check advisories` or `npm audit`): read them in the [run summary](%s), decide, then remove these lines.\n\n' "$CORSA"
            cat corpo/corpo.md
          } > corpo/con-avvisi.md
          mv corpo/con-avvisi.md corpo/corpo.md

      - name: Pubblica la release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: uscita/*
          draft: true
          fail_on_unmatched_files: true
          # Il tag validato dal lavoro `tag` e non `github.ref`: è quello di cui
          # si sono guardate la forma e la versione.
          tag_name: ${{ needs.tag.outputs.tag }}
          # Dal lavoro `tag` (`strumenti/corpo.js`): la sezione per chi ha una
          # build di prova del telefono, poi Windows, poi Android.
          body_path: corpo/corpo.md

      # ── e adesso la bozza va guardata ────────────────────────────────────
      # Restano due gesti a mano, e sono entrambi voluti:
      #
      #   1. scaricare l'installer e l'APK dalla bozza e provarli su una
      #      macchina vera e su un telefono vero. Le prove dicono che il codice
      #      fa quel che deve; non dicono che l'installer parta;
      #   2. pubblicare la bozza. Da quel momento `/releases/latest` la vede, e
      #      ogni copia di Rymembra accesa nel mondo se ne accorge al prossimo
      #      controllo.
      #
      # Automatizzare il secondo si può in due righe. Non si fa: è l'unico punto
      # della catena in cui una persona guarda la cosa prima che parta.
