name: Something doesn't work
description: A fault, a wrong behavior, a screen that doesn't do what it says.
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the time. Four fields, and the third one is usually the one
        that solves the report on its own.

  - type: textarea
    id: cosa
    attributes:
      label: What happened
      description: >-
        What you expected and what you saw instead. It doesn't have to be tidy.
      placeholder: |
        I pressed «Tidy this folder», it showed the plan, I confirmed, and
        three albums disappeared from the library.
    validations:
      required: true

  - type: textarea
    id: come
    attributes:
      label: How to get there
      description: >-
        The steps, even roughly. If it happens one time in ten, write that down:
        it's information, not an excuse.
    validations:
      required: true

  - type: dropdown
    id: dove
    attributes:
      label: Where Rymembra runs
      description: >-
        The log is in a different place in each of the three, and some faults
        exist only in one.
      options:
        - Windows, from the installer on GitHub
        - Windows, from the Microsoft Store
        - Android, from the APK on GitHub
    validations:
      required: true

  - type: textarea
    id: diario
    attributes:
      label: The log
      description: >-
        **On Windows:** in Rymembra,
        **Settings → Updates → “Open the log folder”**. Inside there is
        `rymembra.log`: paste its last lines, or attach the file.

        **On Android:** **Settings → Updates → “Share the log”**, then send it
        to yourself (or save it) and attach it here.

        It doesn't contain your track titles or the paths of your library —
        `PRIVACY.md` § 8 says what ends up in there and what doesn't. The only
        thing of yours in it is the path of the application folder, which
        contains your account name: if you'd rather, delete it before
        pasting.

        **If Rymembra doesn't open at all**, on Windows, from the installer:
        the folder is `%APPDATA%\io.github.federicobaratti.rymembra\diario` —
        paste that into File Explorer's address bar. If that folder doesn't
        exist, look in `%APPDATA%` for the other one whose name starts with
        `io.github.federicobaratti`: right after an upgrade, a start that
        failed leaves the data where the previous version had them.

        From the Microsoft Store, Windows keeps the app's files inside the
        package: open `%LOCALAPPDATA%\Packages\`, then the folder whose name
        starts with `FedericoBaratti.Rymembra_`, then `LocalCache\Roaming`,
        then the folder whose name starts with
        `io.github.federicobaratti.rymembra`, and there `diario`.
      render: text
    validations:
      required: false

  - type: input
    id: versione
    attributes:
      label: Which version
      description: >-
        In Rymembra: **Settings → Updates → “Installed version”**.
      placeholder: "3.2.1"
    validations:
      required: true

  - type: input
    id: sistema
    attributes:
      label: Which Windows or Android
      placeholder: "Windows 11 Pro 24H2 · Android 15 on a Pixel 8"
    validations:
      required: false
